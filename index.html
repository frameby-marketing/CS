<style>

  [data-theme="dark"]{
    --bg:#0f1115; --card:#1a1d24; --card-2:#20242c; --border:#2b2f38;
    --text:#e5e7eb; --text-secondary:#9aa0ab; --text-muted:#6b7280;
    --accent:#3b82f6; --danger:#f87171; --danger-bg:#3a1f22; --success:#4ade80; --success-bg:#16261c;
  }
  [data-theme="light"]{
    --bg:#f5f6f8; --card:#ffffff; --card-2:#f9fafb; --border:#e5e7eb;
    --text:#111827; --text-secondary:#6b7280; --text-muted:#9ca3af;
    --accent:#2563eb; --danger:#dc2626; --danger-bg:#fef2f2; --success:#16a34a; --success-bg:#f0fdf4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);transition:background .15s,color .15s;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,Arial,sans-serif;}
  .wrap{max-width:1160px;margin:0 auto;padding:24px 20px 60px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  h1{font-size:20px;font-weight:600;margin:0;}
  .headline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .meta{font-size:12px;color:var(--text-secondary);}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .icon-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
    border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text);}
  .icon-btn:hover{background:var(--card-2);}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;}
  .text-btn{display:flex;align-items:center;gap:6px;font-size:13px;padding:0 12px;height:34px;
    border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text);
    text-decoration:none;white-space:nowrap;}
  .text-btn:hover{background:var(--card-2);}
  .text-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;}
  .banner{display:none;background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger);
    padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .section-title{font-size:14px;color:var(--text);margin:32px 0 10px;font-weight:600;}
  .section-sub{font-size:12px;color:var(--text-secondary);margin:-6px 0 12px;}
  .range-toolbar{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;}
  .range-btn{font-size:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--card);color:var(--text-secondary);cursor:pointer;}
  .range-btn:hover{background:var(--card-2);color:var(--text);}
  .range-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
  .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .kpi-label{font-size:12px;color:var(--text-secondary);margin:0 0 6px;}
  .kpi-value{font-size:22px;font-weight:600;margin:0;}
  .kpi-sub{font-size:11px;color:var(--text-muted);margin:4px 0 0;}
  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:820px){.grid-2,.grid-3{grid-template-columns:1fr;} header{align-items:flex-start;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-secondary);font-weight:500;font-size:12px;
    padding:6px 8px;border-bottom:1px solid var(--border);}
  td{padding:7px 8px;border-bottom:1px solid var(--card-2);}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-ok{background:var(--success-bg);color:var(--success);}
  .empty{color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-label{width:220px;font-size:12px;flex-shrink:0;white-space:normal;word-break:keep-all;}
  .bar-track{flex:1;background:var(--card-2);border-radius:4px;height:8px;min-width:40px;}
  .bar-fill{background:var(--accent);height:8px;border-radius:4px;}
  .bar-value{width:70px;font-size:12px;color:var(--text-secondary);text-align:right;flex-shrink:0;}
  canvas{max-height:260px;}
</style>
</head>

function fetchCsvRaw(url) {
  return new Promise((resolve, reject) => {
    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (res) => resolve(res.data),
      error: (err) => reject(err),
    });
  });
}
function showBanner(msg) {
  const el = document.getElementById('configBanner');
  if (!msg) { el.style.display = 'none'; return; }
  el.textContent = msg;
  el.style.display = 'block';
}
function themeColors() {
  const styles = getComputedStyle(document.documentElement);
  return {
    text: styles.getPropertyValue('--text-secondary').trim(),
    grid: styles.getPropertyValue('--border').trim(),
  };
}
function fmtMMDD(d) {
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return mm + dd;
}
async function mapLimit(items, limit, fn) {
  const results = new Array(items.length);
  let idx = 0;
  async function worker() {
    while (idx < items.length) {
      const cur = idx++;
      results[cur] = await fn(items[cur], cur);
    }
  }
  await Promise.all(new Array(Math.min(limit, items.length)).fill(0).map(worker));
  return results;
}

// 1) 판매내역(출고확인) 로드 - 날짜별 탭을 하나씩 시도, 유효한 것만 사용
//    상반기(SHEET3)/하반기(SHEET1) 두 스프레드시트 모두 같은 방식으로 처리.
//    상반기 초반 탭은 "상품코드" 컬럼명이 "제품명"으로 되어있고 비어있는 경우가
//    있어 두 컬럼명을 모두 확인한다 (없으면 상품별 집계에서 주문내역으로 대체).
// ------------------------------------------------------------------
async function fetchOneSalesDay(spreadsheetId, dateObj) {
  const mmdd = fmtMMDD(dateObj);
  const sheetName = mmdd + '(출고확인)';
  const url = gvizCsvUrlBySheetName(spreadsheetId, sheetName);
  try {
    const rows = await fetchCsvRaw(url);
    // 탭이 없으면 구글이 워크북의 첫 번째 탭으로 대체 응답하므로
    // 헤더에 "주문번호"가 있는지로 유효한 (출고확인) 탭인지 판별
    if (!rows.length || !('주문번호' in rows[0])) return null;
    const clean = rows
      .filter(r => r['주문번호'])
      .map(r => ({
        orderNo: r['주문번호'],
        trackingNo: r['운송장번호'],
        item: r['주문내역'] || '',
        sku: r['상품코드'] || r['제품명'] || '',
        qty: Number(r['수량']) || 0,
        platform: r['플랫폼명'] || '기타',
        orderStatus: r['주문상태'] || '',
        deliveryStatus: r['배송상태'] || '',
        confirmDate: mmdd,
      }));
    return clean;
  } catch (e) {
    return null;
  }
}

async function fetchSalesRange(spreadsheetId, startStr, endStr) {
  const start = new Date(startStr + 'T00:00:00');
  const end = endStr ? new Date(endStr + 'T00:00:00') : new Date();
  const dates = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    dates.push(new Date(d));
  }
  const perDay = await mapLimit(dates, 6, (d) => fetchOneSalesDay(spreadsheetId, d));
  const validDays = [];
  let allRows = [];
  perDay.forEach((rows, i) => {
    if (rows) {
      validDays.push(fmtMMDD(dates[i]));
      allRows = allRows.concat(rows);
    }
  });
  return { rows: allRows, validDays };
}

async function fetchAllSalesData() {
  const results = await Promise.all(
    SALES_RANGES.map(r => fetchSalesRange(r.id, r.start, r.end))
  );
  let allRows = [];
  let allValidDays = [];
  results.forEach(res => {
    allRows = allRows.concat(res.rows);
    allValidDays = allValidDays.concat(res.validDays);
  });
  return { rows: allRows, validDays: allValidDays };
}

// 플랫폼명 정규화: 네이버/자사/M몰/쿠팡 4개로만 묶고, 여기에 해당하지 않는
// 플랫폼(기타 오픈마켓 등)은 플랫폼별 비중 집계에서 제외한다.
function normalizePlatform(name) {
  const s = (name || '');
  if (/네이버/.test(s)) return '네이버';
  if (/쿠팡/.test(s)) return '쿠팡';
  if (/m\s*몰|엠몰/i.test(s)) return 'M몰';
  if (/자사/.test(s)) return '자사';
  return null;
}

// 주문상태 정규화: 누락출고/누락재출고/누락재배송 등 "누락" 계열은 모두
// 하나의 상태("누락출고")로 묶어서 보기 편하게 만든다.
function normalizeOrderStatus(status) {
  const s = (status || '').replace(/\s+/g, '');
  if (!s) return '(미상)';
  if (/누락/.test(s)) return '누락출고';
  return status.trim();
}

function aggregateSales(data) {
  const { rows, validDays } = data;
  const byDate = {};
  const byPlatform = {};
  const bySku = {};
  const byStatus = {};
  let totalQty = 0;

  rows.forEach(r => {
    byDate[r.confirmDate] = byDate[r.confirmDate] || { count: 0, qty: 0 };
    byDate[r.confirmDate].count += 1;
    byDate[r.confirmDate].qty += r.qty;

    const platformKey = normalizePlatform(r.platform);
    if (platformKey) {
      byPlatform[platformKey] = (byPlatform[platformKey] || 0) + r.qty;
    }

    const skuKey = r.sku || r.item.slice(0, 20) || '(미상)';
    bySku[skuKey] = (bySku[skuKey] || 0) + r.qty;

    const statusKey = normalizeOrderStatus(r.orderStatus);
    byStatus[statusKey] = (byStatus[statusKey] || 0) + 1;

    totalQty += r.qty;
  });

  const issueCount = rows.filter(r => /누락|반품|환불/.test(r.orderStatus)).length;

  return {
    totalOrders: rows.length,
    totalQty,
    dayCount: validDays.length,
    issueCount,
    byDate,
    byPlatform,
    bySku,
    byStatus,
    validDays: Array.from(new Set(validDays)).sort(),
  };
}

// 최근 N일(유효 집계일 기준) 필터
function filterRowsByRecentDays(rawData, days) {
  const sortedDays = Array.from(new Set(rawData.validDays)).sort();
  const recentDays = new Set(sortedDays.slice(-days));
  const rows = rawData.rows.filter(r => recentDays.has(r.confirmDate));
  return { rows, validDays: sortedDays.slice(-days) };
}

// 월별 출고 추이(전체 기간 기준, 최근 N일 필터와 무관) - 출고 수량(qty) 합계
function aggregateMonthlyTrend(rawData) {
  const byMonth = {};
  rawData.rows.forEach(r => {
    const month = '2026-' + r.confirmDate.slice(0, 2);
    byMonth[month] = (byMonth[month] || 0) + r.qty;
  });
  return Object.keys(byMonth).sort().map(month => ({ month, qty: byMonth[month] }));
}

// 값 위에 %(또는 지정한 접미사) 라벨을 찍어주는 경량 플러그인
function makePointLabelPlugin(suffix) {
  return {
    id: 'pointLabelPlugin',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      chart.data.datasets.forEach((dataset, i) => {
        const meta = chart.getDatasetMeta(i);
        if (meta.hidden) return;
        meta.data.forEach((point, idx) => {
          const value = dataset.data[idx];
          if (value === null || value === undefined) return;
          ctx.save();
          ctx.fillStyle = dataset.borderColor || '#e5e7eb';
          ctx.font = '600 11px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(value + (suffix || ''), point.x, point.y - 8);
          ctx.restore();
        });
      });
    },
  };
}

function skuLabel(sku) {
  let label = SKU_MAP[sku] || sku;
  label = label
    .replace('DW STAND PRO 실버', 'DW 프로 실버')
    .replace('DW STAND PRO 블랙', 'DW 프로 블랙')
    .replace('DW STAND PLUS 실버', 'DW 플러스 실버')
    .replace('DW STAND PLUS 블랙', 'DW 플러스 블랙')
    .replace('DW STAND PLUS 그린', 'DW 플러스 그린')
    .replace('PH STAND 실버', 'PH 실버')
    .replace('PH STAND 블랙', 'PH 블랙')
    .replace('맥세이프 케이스 에어', '맥세이프 에어')
    .replace('맥세이프 케이스 범퍼', '맥세이프 범퍼')
    .replace('MAGSAFE GRIP', '맥세이프 그립')
    .replace('MAGSAFE KICK FRAME', '킥프레임');
  return label;
}

function renderProductBars(agg) {
  // "프레임 케이스 범퍼" 계열은 모델별로 나누지 않고 "프레임케이스 범퍼" 하나로 통합

  const top = Object.entries(merged).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const max = top.length ? top[0][1] : 1;
  const el = document.getElementById('productBars');

async function fetchShippingMaster() {
  const url = gvizCsvUrlByGid(SHEET2_ID, SHEET2_MASTER_GID);
  const rows = await fetchCsvRaw(url);
  return rows
    .filter(r => r['date'])
    .map(r => ({
      date: r['date'],
      count: Number(r['count']) || 0,
      missing: Number(r['missing']) || 0,
      wrong: Number(r['wrong']) || 0,
      returns: Number(r['returns']) || 0,
    }));
}

function aggregateShippingByMonth(rows) {
  const byMonth = {};
  rows.forEach(r => {
    const month = r.date.slice(0, 7); // YYYY-MM
    if (month < SHIPPING_START_MONTH || month > SHIPPING_END_MONTH) return;
    byMonth[month] = byMonth[month] || { count: 0, missing: 0, wrong: 0, returns: 0 };
    byMonth[month].count += r.count;
    byMonth[month].missing += r.missing;
    byMonth[month].wrong += r.wrong;
    byMonth[month].returns += r.returns;
  });
  return Object.keys(byMonth).sort().map(month => {
    const m = byMonth[month];
    return {
      month,
      ...m,
      missingRate: m.count ? m.missing / m.count : 0,
      wrongRate: m.count ? m.wrong / m.count : 0,
      returnsRate: m.count ? m.returns / m.count : 0,
    };
  });
}

    const [salesRaw, shippingRaw] = await Promise.all([
      fetchAllSalesData(),
      fetchShippingMaster(),
    ]);

    lastRawSalesData = salesRaw;
    applyRangeFilterAndRender();
    renderMonthlyTrendChart(aggregateMonthlyTrend(salesRaw));

    const shippingMonthly = aggregateShippingByMonth(shippingRaw);
    lastShippingData = shippingMonthly;
    renderShippingChart(shippingMonthly);
    renderShippingTable(shippingMonthly);

    document.getElementById('lastUpdated').textContent = '마지막 갱신 ' + new Date().toLocaleTimeString('ko-KR');
  } catch (e) {
    document.getElementById('lastUpdated').textContent = '불러오기 실패';
    showBanner('데이터를 불러오지 못했습니다 (' + e.message + '). 두 스프레드시트가 "링크가 있는 모든 사용자" 이상으로 공유돼 있는지 확인해주세요.');
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadAll);
loadAll();
</script>
</body>
</html>

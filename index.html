<style>

  [data-theme="dark"]{
    --bg:#0f1115; --card:#1a1d24; --card-2:#20242c; --border:#2b2f38;
    --text:#e5e7eb; --text-secondary:#9aa0ab; --text-muted:#6b7280;
    --accent:#3b82f6; --danger:#f87171; --danger-bg:#3a1f22; --success:#4ade80; --success-bg:#16261c;
  }
  [data-theme="light"]{
    --bg:#f5f6f8; --card:#ffffff; --card-2:#f9fafb; --border:#e5e7eb;
    --text:#111827; --text-secondary:#6b7280; --text-muted:#9ca3af;
    --accent:#2563eb; --danger:#dc2626; --danger-bg:#fef2f2; --success:#16a34a; --success-bg:#f0fdf4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);transition:background .15s,color .15s;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,Arial,sans-serif;}
  .wrap{max-width:1160px;margin:0 auto;padding:24px 20px 60px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  h1{font-size:20px;font-weight:600;margin:0;}
  .headline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .meta{font-size:12px;color:var(--text-secondary);}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .icon-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
    border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text);}
  .icon-btn:hover{background:var(--card-2);}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;}
  .text-btn{display:flex;align-items:center;gap:6px;font-size:13px;padding:0 12px;height:34px;
    border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text);
    text-decoration:none;white-space:nowrap;}
  .text-btn:hover{background:var(--card-2);}
  .text-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;}
  .banner{display:none;background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger);
    padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .section-title{font-size:14px;color:var(--text);margin:32px 0 10px;font-weight:600;}
  .section-sub{font-size:12px;color:var(--text-secondary);margin:-6px 0 12px;}
  .range-toolbar{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;}
  .range-btn{font-size:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--card);color:var(--text-secondary);cursor:pointer;}
  .range-btn:hover{background:var(--card-2);color:var(--text);}
  .range-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
  .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .kpi-label{font-size:12px;color:var(--text-secondary);margin:0 0 6px;}
  .kpi-value{font-size:22px;font-weight:600;margin:0;}
  .kpi-sub{font-size:11px;color:var(--text-muted);margin:4px 0 0;}
  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:820px){.grid-2,.grid-3{grid-template-columns:1fr;} header{align-items:flex-start;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-secondary);font-weight:500;font-size:12px;
    padding:6px 8px;border-bottom:1px solid var(--border);}
  td{padding:7px 8px;border-bottom:1px solid var(--card-2);}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-ok{background:var(--success-bg);color:var(--success);}
  .empty{color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-label{width:220px;font-size:12px;flex-shrink:0;white-space:normal;word-break:keep-all;}
  .bar-track{flex:1;background:var(--card-2);border-radius:4px;height:8px;min-width:40px;}
  .bar-fill{background:var(--accent);height:8px;border-radius:4px;}
  .bar-value{width:70px;font-size:12px;color:var(--text-secondary);text-align:right;flex-shrink:0;}
  canvas{max-height:260px;}
</style>
</head>

function fetchCsvRaw(url) {
  return new Promise((resolve, reject) => {
    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (res) => resolve(res.data),
      error: (err) => reject(err),
    });
  });
}
function showBanner(msg) {
  const el = document.getElementById('configBanner');
  if (!msg) { el.style.display = 'none'; return; }
  el.textContent = msg;
  el.style.display = 'block';
}
function themeColors() {
  const styles = getComputedStyle(document.documentElement);
  return {
    text: styles.getPropertyValue('--text-secondary').trim(),
    grid: styles.getPropertyValue('--border').trim(),
  };
}
function fmtMMDD(d) {
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return mm + dd;
}
async function mapLimit(items, limit, fn) {
  const results = new Array(items.length);
  let idx = 0;
  async function worker() {
    while (idx < items.length) {
      const cur = idx++;
      results[cur] = await fn(items[cur], cur);
    }
  }
  await Promise.all(new Array(Math.min(limit, items.length)).fill(0).map(worker));
  return results;
}

// 1) 판매내역(출고확인) 로드 - 날짜별 탭을 하나씩 시도, 유효한 것만 사용
//    상반기(SHEET3)/하반기(SHEET1) 두 스프레드시트 모두 같은 방식으로 처리.
//    상반기 초반 탭은 "상품코드" 컬럼명이 "제품명"으로 되어있고 비어있는 경우가
//    있어 두 컬럼명을 모두 확인한다 (없으면 상품별 집계에서 주문내역으로 대체).
// ------------------------------------------------------------------
async function fetchOneSalesDay(spreadsheetId, dateObj) {
  const mmdd = fmtMMDD(dateObj);
  const sheetName = mmdd + '(출고확인)';
  const url = gvizCsvUrlBySheetName(spreadsheetId, sheetName);
  try {
    const rows = await fetchCsvRaw(url);
    // 탭이 없으면 구글이 워크북의 첫 번째 탭으로 대체 응답하므로
    // 헤더에 "주문번호"가 있는지로 유효한 (출고확인) 탭인지 판별
    if (!rows.length || !('주문번호' in rows[0])) return null;
    const clean = rows
      .filter(r => r['주문번호'])
      .map(r => ({
        orderNo: r['주문번호'],
        trackingNo: r['운송장번호'],
        item: r['주문내역'] || '',
        sku: r['상품코드'] || r['제품명'] || '',
        qty: Number(r['수량']) || 0,
        platform: r['플랫폼명'] || '기타',
        orderStatus: r['주문상태'] || '',
        deliveryStatus: r['배송상태'] || '',
        confirmDate: mmdd,
      }));
    return clean;
  } catch (e) {
    return null;
  }
}

async function fetchSalesRange(spreadsheetId, startStr, endStr) {
  const start = new Date(startStr + 'T00:00:00');
  const end = endStr ? new Date(endStr + 'T00:00:00') : new Date();
  const dates = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    dates.push(new Date(d));
  }
  const perDay = await mapLimit(dates, 10, (d) => fetchOneSalesDay(spreadsheetId, d));
  const validDays = [];
  let allRows = [];
  perDay.forEach((rows, i) => {
    if (rows) {
      validDays.push(fmtMMDD(dates[i]));
      allRows = allRows.concat(rows);
    }
  });
  return { rows: allRows, validDays };
}

async function fetchAllSalesData() {
  const results = await Promise.all(
    SALES_RANGES.map(r => fetchSalesRange(r.id, r.start, r.end))
  );
  let allRows = [];
  let allValidDays = [];
  results.forEach(res => {
    allRows = allRows.concat(res.rows);
    allValidDays = allValidDays.concat(res.validDays);
  });
  return { rows: allRows, validDays: allValidDays };
}

// 주문상태 정규화: 표현만 다르고 의미가 같은 상태들을 최대한 큰 카테고리로 묶어서
// 표에 비슷한 항목이 중복 나열되지 않도록 한다.
function normalizeOrderStatus(status) {
  const s = (status || '').replace(/\s+/g, '');
  if (!s) return '(미상)';
  if (/누락/.test(s)) return '누락출고';
  if (/오배송|오배달/.test(s)) return '오배송';
  if (/반품/.test(s)) return '반품';
  if (/교환/.test(s)) return '교환';
  if (/환불/.test(s)) return '환불';
  if (/취소/.test(s)) return '취소';
  if (/지연|보류/.test(s)) return '배송지연/보류';
  if (/완료|정상/.test(s)) return '정상출고';
  return status.trim();
}

function aggregateSales(data) {
  const { rows, validDays } = data;
  const byDate = {};
  const byStatus = {};
  let totalQty = 0;

  rows.forEach(r => {
    byDate[r.confirmDate] = byDate[r.confirmDate] || { count: 0, qty: 0 };
    byDate[r.confirmDate].count += 1;
    byDate[r.confirmDate].qty += r.qty;

    const statusKey = normalizeOrderStatus(r.orderStatus);
    byStatus[statusKey] = (byStatus[statusKey] || 0) + 1;

    totalQty += r.qty;
  });

  const issueCount = rows.filter(r => /누락|반품|환불/.test(r.orderStatus)).length;

  return {
    totalOrders: rows.length,
    totalQty,
    dayCount: validDays.length,
    issueCount,
    byDate,
    byStatus,
    validDays: Array.from(new Set(validDays)).sort(),
  };
}

// 최근 N일(유효 집계일 기준) 필터
function filterRowsByRecentDays(rawData, days) {
  const sortedDays = Array.from(new Set(rawData.validDays)).sort();
  const recentDays = new Set(sortedDays.slice(-days));
  const rows = rawData.rows.filter(r => recentDays.has(r.confirmDate));
  return { rows, validDays: sortedDays.slice(-days) };
}

// 월별 출고 추이(전체 기간 기준, 최근 N일 필터와 무관) - 출고 수량(qty) 합계
function aggregateMonthlyTrend(rawData) {
  const byMonth = {};
  rawData.rows.forEach(r => {
    const month = '2026-' + r.confirmDate.slice(0, 2);
    byMonth[month] = (byMonth[month] || 0) + r.qty;
  });
  return Object.keys(byMonth).sort().map(month => ({ month, qty: byMonth[month] }));
}

// 값 위에 %(또는 지정한 접미사) 라벨을 찍어주는 경량 플러그인
function makePointLabelPlugin(suffix) {
  return {
    id: 'pointLabelPlugin',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      chart.data.datasets.forEach((dataset, i) => {
        const meta = chart.getDatasetMeta(i);
        if (meta.hidden) return;
        meta.data.forEach((point, idx) => {
          const value = dataset.data[idx];
          if (value === null || value === undefined) return;

          ctx.fillStyle = dataset.borderColor || '#e5e7eb';
          ctx.font = '600 11px -apple-system, BlinkMacSystemFont, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(value + (suffix || ''), point.x, point.y - 8);
          ctx.restore();
        });
      });
    },
  };
}

// 상품별 출고 TOP10 표시용 이름 축약 규칙 (모델/색상별로 나누지 않는 개별 케이스)
function skuLabel(sku) {
  let label = SKU_MAP[sku] || sku;
  label = label
    .replace('DW STAND PRO 실버', 'DW 프로 실버')
    .replace('DW STAND PRO 블랙', 'DW 프로 블랙')
    .replace('DW STAND PLUS 실버', 'DW 플러스 실버')
    .replace('DW STAND PLUS 블랙', 'DW 플러스 블랙')
    .replace('DW STAND PLUS 그린', 'DW 플러스 그린')
    .replace('MAGSAFE GRIP', '맥세이프 그립');
  return label;
}

// 모델/기종 구분 없이 하나의 상품군으로 완전히 합쳐서 보여줄 것들.
// rawLabel(코드→이름 변환 결과, 없으면 원본 텍스트)을 공백 제거 후 키워드로 판별한다.
function productFamilyLabel(rawLabel) {
  const norm = (rawLabel || '').replace(/\s+/g, '');
  if (norm.includes('프레임팁') && norm.includes('스타터')) return '프레임팁 스타터팩';
  if (/ph/i.test(norm) && norm.includes('블랙')) return 'PH 블랙';
  if (/ph/i.test(norm) && (norm.includes('실버') || norm.includes('그레'))) return 'PH 실버';
  if (norm.includes('프레임케이스') && norm.includes('범퍼')) return '프레임케이스 범퍼';
  if (norm.includes('액정보호필름')) return '액정보호필름';
  if (norm.includes('킥프레임') || /kick/i.test(norm)) return '킥프레임';
  if (norm.includes('맥세이프') && norm.includes('에어') && !norm.includes('범퍼')) return '맥세이프 에어';
  if (norm.includes('맥세이프') && norm.includes('범퍼')) return '맥세이프 범퍼';
  return null;
}

// sku -> qty 맵을 제품별 출고 TOP10과 동일한 이름 축약/통합 규칙으로 합친다
function mergeBySkuLabel(bySkuMap) {
  const merged = {};
  Object.entries(bySkuMap).forEach(([sku, qty]) => {
    const rawLabel = SKU_MAP[sku] || sku;
    const key = productFamilyLabel(rawLabel) || skuLabel(sku);
    merged[key] = (merged[key] || 0) + qty;
  });
  return merged;
}

function renderBarList(elId, merged, limit) {
  const top = Object.entries(merged).sort((a, b) => b[1] - a[1]).slice(0, limit);
  const max = top.length ? top[0][1] : 1;
  const el = document.getElementById(elId);
  if (!top.length) { el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  el.innerHTML = top.map(([label, qty]) => `
    <div class="bar-row">
      <span class="bar-label" title="${label}">${label}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4, qty / max * 100)}%"></div></div>
      <span class="bar-value">${qty.toLocaleString('ko-KR')}</span>
    </div>`).join('');
}

// 제품별 출고/교환 TOP5 + 원형그래프용: 지정한 "최근 N일" 구간에서 (교환만 볼지
// 여부에 따라) 제품 라벨별 수량을 합산하고 TOP5 + 나머지(otherSum)를 반환한다.
// filterRowsByRecentDays는 기존 전역 기간 필터와 동일한 기준(최근 N개 확정일)을
// 재사용해 대시보드 전체의 "최근 N일" 정의를 일관되게 유지한다.
function computeTopNBreakdown(rawData, days, onlyExchange) {
  const filtered = filterRowsByRecentDays(rawData, days).rows;
  const src = onlyExchange
    ? filtered.filter(r => normalizeOrderStatus(r.orderStatus) === '교환')
    : filtered;
  const bySku = {};
  let total = 0;
  src.forEach(r => {
    const skuKey = r.sku || r.item.slice(0, 20) || '(미상)';
    bySku[skuKey] = (bySku[skuKey] || 0) + r.qty;
    total += r.qty;
  });
  const merged = mergeBySkuLabel(bySku);
  const sorted = Object.entries(merged).sort((a, b) => b[1] - a[1]);
  const top5 = sorted.slice(0, 5);
  const top5Sum = top5.reduce((s, [, v]) => s + v, 0);
  return { top5, otherSum: Math.max(0, total - top5Sum) };
}

const TOP5_PIE_COLORS = ['#3b82f6', '#f59e0b', '#a78bfa', '#4ade80', '#f87171', '#64748b'];
let shipTopPieInstance, exchTopPieInstance;

// 파이 조각 위에 직접 "제품명 / 비율(%)"을 그려주는 플러그인.
// 비율이 클수록 글씨를 크게, 작을수록 작게 그린다 (9~20px 사이로 보간).
function pieSliceLabelPlugin() {
  return {
    id: 'pieSliceLabelPlugin',
    afterDatasetsDraw(chart) {
      const meta = chart.getDatasetMeta(0);
      if (!meta || meta.hidden) return;
      const dataArr = chart.data.datasets[0].data;
      const total = dataArr.reduce((s, v) => s + (Number(v) || 0), 0);
      if (!total) return;
      const { ctx } = chart;
      meta.data.forEach((arc, idx) => {
        const value = Number(dataArr[idx]) || 0;
        if (!value) return;
        const pct = (value / total) * 100;
        const pos = arc.tooltipPosition ? arc.tooltipPosition() : { x: arc.x, y: arc.y };
        const nameSize = Math.max(9, Math.min(20, 9 + (pct / 100) * 30));
        const pctSize = Math.max(8, nameSize - 3);
        const label = chart.data.labels[idx] || '';
        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,.55)';
        ctx.shadowBlur = 3;
        ctx.font = '700 ' + nameSize + 'px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(label, pos.x, pos.y - nameSize * 0.62);
        ctx.font = '600 ' + pctSize + 'px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(pct.toFixed(1) + '%', pos.x, pos.y + pctSize * 0.62);
        ctx.restore();
      });
    },
  };
}

function renderTopPie(canvasId, prevInstance, top5, otherSum) {
  const labels = top5.map(([label]) => label);
  const data = top5.map(([, val]) => val);
  if (otherSum > 0) { labels.push('기타'); data.push(otherSum); }
  const ctx = document.getElementById(canvasId);
  if (prevInstance) prevInstance.destroy();
  return new Chart(ctx, {
    type: 'pie',
    data: { labels, datasets: [{ data, backgroundColor: TOP5_PIE_COLORS }] },
    options: { responsive: true, plugins: { legend: { display: false } } },
    plugins: [pieSliceLabelPlugin()],
  });
}

function refreshShipTop() {
  if (!lastRawSalesData) return;
  const { top5, otherSum } = computeTopNBreakdown(lastRawSalesData, shipTopDays, false);
  renderBarList('productBars', Object.fromEntries(top5), 5);
  shipTopPieInstance = renderTopPie('shipTopPie', shipTopPieInstance, top5, otherSum);
}

function refreshExchTop() {
  if (!lastRawSalesData) return;
  const { top5, otherSum } = computeTopNBreakdown(lastRawSalesData, exchTopDays, true);
  renderBarList('exchangeBars', Object.fromEntries(top5), 5);
  exchTopPieInstance = renderTopPie('exchTopPie', exchTopPieInstance, top5, otherSum);
}

function wireTopRangeToolbar(toolbarId, getDays, setDays, refreshFn) {
  document.querySelectorAll('#' + toolbarId + ' .range-btn').forEach(btn => {
    if (Number(btn.dataset.days) === getDays()) btn.classList.add('active');
    btn.addEventListener('click', () => {
      setDays(Number(btn.dataset.days));
      document.querySelectorAll('#' + toolbarId + ' .range-btn').forEach(b => b.classList.toggle('active', b === btn));
      refreshFn();
    });
  });
}
wireTopRangeToolbar('shipTopRangeToolbar', () => shipTopDays, (v) => { shipTopDays = v; }, refreshShipTop);
wireTopRangeToolbar('exchTopRangeToolbar', () => exchTopDays, (v) => { exchTopDays = v; }, refreshExchTop);

function renderOrderStatusTable(agg) {
  const tbody = document.querySelector('#orderStatusTable tbody');
  const entries = Object.entries(agg.byStatus).sort((a, b) => b[1] - a[1]);
  if (!entries.length) { tbody.innerHTML = '<tr><td colspan="2" class="empty">데이터 없음</td></tr>'; return; }
  tbody.innerHTML = entries.map(([status, count]) =>
    `<tr><td>${status}</td><td class="num">${count.toLocaleString('ko-KR')}</td></tr>`
  ).join('');
}

// 주문상태별 현황도 상단 KPI 필터와 별개로, 자체 기간 버튼으로 독립 제어된다.
let orderStatusDays = 7;
function refreshOrderStatus() {
  if (!lastRawSalesData) return;
  const filtered = filterRowsByRecentDays(lastRawSalesData, orderStatusDays);
  renderOrderStatusTable(aggregateSales(filtered));
}
wireTopRangeToolbar('orderStatusRangeToolbar', () => orderStatusDays, (v) => { orderStatusDays = v; }, refreshOrderStatus);

// ------------------------------------------------------------------
// 2) 배송현황 (일자,택배건수,누락,오배송,반품) 마스터 표 -> 월별 집계
// ------------------------------------------------------------------
async function fetchShippingMaster() {
  const url = gvizCsvUrlByGid(SHEET2_ID, SHEET2_MASTER_GID);
  const rows = await fetchCsvRaw(url);
  return rows
    .filter(r => r['date'])
    .map(r => ({
      date: r['date'],
      count: Number(r['count']) || 0,
      missing: Number(r['missing']) || 0,
      wrong: Number(r['wrong']) || 0,
      returns: Number(r['returns']) || 0,
    }));
}

function aggregateShippingByMonth(rows) {
  const byMonth = {};
  rows.forEach(r => {
    const month = r.date.slice(0, 7); // YYYY-MM
    if (month < SHIPPING_START_MONTH || month > SHIPPING_END_MONTH) return;
    byMonth[month] = byMonth[month] || { count: 0, missing: 0, wrong: 0, returns: 0 };
    byMonth[month].count += r.count;
    byMonth[month].missing += r.missing;
    byMonth[month].wrong += r.wrong;
    byMonth[month].returns += r.returns;
  });
  return Object.keys(byMonth).sort().map(month => {
    const m = byMonth[month];
    return {
      month,
      ...m,
      missingRate: m.count ? m.missing / m.count : 0,
      wrongRate: m.count ? m.wrong / m.count : 0,
      returnsRate: m.count ? m.returns / m.count : 0,
    };
  });
}

let lastShippingData = null;
let shippingChartInstance;
let selectedShippingMetric = 'missing';
const SHIPPING_METRIC_CONFIG = {
  missing: { key: 'missingRate', label: '누락율(%)', color: '#f87171' },
  wrong: { key: 'wrongRate', label: '오배송율(%)', color: '#f59e0b' },
  returns: { key: 'returnsRate', label: '반품율(%)', color: '#a78bfa' },
};

function renderShippingChart(monthly) {
  const canvas = document.getElementById('shippingTrendChart');
  const cfg = SHIPPING_METRIC_CONFIG[selectedShippingMetric];
  const colors = themeColors();
  if (shippingChartInstance) shippingChartInstance.destroy();
  shippingChartInstance = new Chart(canvas, {
    type: 'line',
    data: {
      labels: monthly.map(m => m.month),
      datasets: [
        { label: cfg.label, data: monthly.map(m => +(m[cfg.key] * 100).toFixed(2)), borderColor: cfg.color, backgroundColor: cfg.color + '22', tension: 0.2 },
      ],
    },
    options: {
      responsive: true,
      layout: { padding: { top: 24 } },
      plugins: { legend: { position: 'bottom', labels: { color: colors.text, font: { size: 11 } } } },
      scales: {
        y: { beginAtZero: true, ticks: { color: colors.text, callback: v => v + '%' }, grid: { color: colors.grid } },
        x: { ticks: { color: colors.text }, grid: { display: false } },
      },
    },
    plugins: [makePointLabelPlugin('%')],
  });
}

document.querySelectorAll('#shippingMetricToolbar .range-btn').forEach(btn => {
  if (btn.dataset.metric === selectedShippingMetric) btn.classList.add('active');
  btn.addEventListener('click', () => {
    selectedShippingMetric = btn.dataset.metric;
    document.querySelectorAll('#shippingMetricToolbar .range-btn').forEach(b => b.classList.toggle('active', b === btn));
    if (lastShippingData) renderShippingChart(lastShippingData);
  });
});

function renderShippingTable(monthly) {
  const tbody = document.querySelector('#shippingTable tbody');
  if (!monthly.length) { tbody.innerHTML = '<tr><td colspan="8" class="empty">데이터 없음</td></tr>'; return; }
  tbody.innerHTML = monthly.map(m => `
    <tr>
      <td>${m.month}</td>
      <td class="num">${m.count.toLocaleString('ko-KR')}</td>
      <td class="num">${m.missing.toLocaleString('ko-KR')}</td>
      <td class="num">${m.wrong.toLocaleString('ko-KR')}</td>
      <td class="num">${m.returns.toLocaleString('ko-KR')}</td>
      <td class="num">${(m.missingRate * 100).toFixed(2)}%</td>
      <td class="num">${(m.wrongRate * 100).toFixed(2)}%</td>
      <td class="num">${(m.returnsRate * 100).toFixed(2)}%</td>
    </tr>`).join('');
}

// ------------------------------------------------------------------
// 메인 로드
// ------------------------------------------------------------------
// ------------------------------------------------------------------
// 로딩 속도 개선: 판매내역은 날짜별 시트 탭을 하나씩 요청하는 구조라
// (2026-01-05 ~ 오늘, 2개 스프레드시트) 매번 200개 넘는 요청을 새로
// 보내야 해서 느리다. localStorage에 마지막으로 불러온 데이터를 캐시해두고,
// 재방문 시에는 캐시를 즉시 보여준 뒤 백그라운드에서 최신 데이터로
// 조용히 갱신한다(stale-while-revalidate) — 첫 로딩 외에는 체감 속도가
// 크게 빨라진다.
// ------------------------------------------------------------------
const CACHE_KEY = 'cs-dashboard-cache-v1';

function saveCache(salesRaw, shippingRaw) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), salesRaw, shippingRaw }));
  } catch (e) {}
}
function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

// 상단 전역 기간 필터(#rangeToolbar)는 KPI 카드만 담당한다.
// 제품별 출고/교환 TOP5, 주문상태별 현황은 각자의 행에 있는 별도 기간 버튼으로
// 독립적으로 제어된다 (refreshShipTop/refreshExchTop/refreshOrderStatus).
function applyRangeFilterAndRender() {
  if (!lastRawSalesData) return;
  const filtered = filterRowsByRecentDays(lastRawSalesData, selectedRangeDays);
  const agg = aggregateSales(filtered);
  lastSalesData = agg;
  renderSalesKpis(agg);
}

document.querySelectorAll('#rangeToolbar .range-btn').forEach(btn => {
  if (Number(btn.dataset.days) === selectedRangeDays) btn.classList.add('active');
  btn.addEventListener('click', () => {
    selectedRangeDays = Number(btn.dataset.days);
    document.querySelectorAll('#rangeToolbar .range-btn').forEach(b => b.classList.toggle('active', b === btn));
    applyRangeFilterAndRender();
  });
});

function renderFromRaw(salesRaw, shippingRaw) {
  lastRawSalesData = salesRaw;
  applyRangeFilterAndRender();
  renderMonthlyTrendChart(aggregateMonthlyTrend(salesRaw));
  refreshShipTop();
  refreshExchTop();
  refreshOrderStatus();

  const shippingMonthly = aggregateShippingByMonth(shippingRaw);
  lastShippingData = shippingMonthly;
  renderShippingChart(shippingMonthly);
  renderShippingTable(shippingMonthly);
}

async function loadAll(forceRefresh) {
  const cached = !forceRefresh ? loadCache() : null;
  if (cached) {
    // 캐시를 먼저 즉시 표시 (체감 로딩시간 단축), 최신 데이터는 아래서 백그라운드로 이어서 불러온다
    renderFromRaw(cached.salesRaw, cached.shippingRaw);
    const ageMin = Math.max(0, Math.round((Date.now() - cached.savedAt) / 60000));
    document.getElementById('lastUpdated').textContent = '캐시된 데이터 (' + ageMin + '분 전) · 최신 데이터 불러오는 중...';
  } else {
    document.getElementById('lastUpdated').textContent = '불러오는 중...';
  }
  showBanner(null);
  try {
    const [salesRaw, shippingRaw] = await Promise.all([
      fetchAllSalesData(),
      fetchShippingMaster(),
    ]);

    renderFromRaw(salesRaw, shippingRaw);
    saveCache(salesRaw, shippingRaw);

    document.getElementById('lastUpdated').textContent = '마지막 갱신 ' + new Date().toLocaleTimeString('ko-KR');
  } catch (e) {
    if (cached) {
      document.getElementById('lastUpdated').textContent = '캐시된 데이터 표시 중 (최신 데이터를 불러오지 못했습니다)';
    } else {
      document.getElementById('lastUpdated').textContent = '불러오기 실패';
      showBanner('데이터를 불러오지 못했습니다 (' + e.message + '). 두 스프레드시트가 "링크가 있는 모든 사용자" 이상으로 공유돼 있는지 확인해주세요.');
    }
  }
}

document.getElementById('refreshBtn').addEventListener('click', () => loadAll(true));
loadAll(false);
</script>

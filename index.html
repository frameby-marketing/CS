<!doctype html><html lang="ko" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CX 통합</title><meta name="theme-color" content="#12151c">
<script>(function(){try{var v=localStorage.getItem("theme");if(v!=="light"&&v!=="dark")v=localStorage.getItem("fb-hub-theme");document.documentElement.setAttribute("data-theme",v==="light"?"light":"dark")}catch(e){}})();</script>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--text:#e8eaed;--sub:#9aa1ac;--accent:#4c8dff;--accent2:#8b7bf0;--good:#3ecf8e;--bad:#ff5c6c;--warn:#ffb648;--teal:#20b58b;--track:#262b36;--grid:#242832;--soft:rgba(76,141,255,.10);--tipbg:#0b0d12}
html[data-theme="light"]{--bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--text:#1a1d23;--sub:#6b7280;--accent:#2a78d6;--accent2:#7059c9;--good:#0a8a3f;--bad:#d93a3a;--warn:#b36f00;--teal:#0f8f6a;--track:#eceef1;--grid:#eceef1;--soft:rgba(42,120,214,.08);--tipbg:#1a1d23}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,"Apple SD Gothic Neo",Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .15s,color .15s}
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 56px}
button{font-family:inherit}
a{color:var(--accent);text-decoration:none}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--sub);font-size:12.5px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px;font-weight:600}
.status i{width:8px;height:8px;border-radius:50%;background:var(--sub)}
.status.live i{background:var(--good);box-shadow:0 0 0 3px rgba(62,207,142,.18)}
.status.err i{background:var(--bad)}
.seg{display:inline-flex;background:var(--track);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--sub);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.seg.theme button{padding:6px 10px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pnav{display:flex;align-items:center;gap:8px}
.pnav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px;cursor:pointer}
.pnav button:disabled{opacity:.3;cursor:default}
.plabel{text-align:center;min-width:200px}
.plabel b{display:block;font-size:15px}
.plabel small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.banner{display:none;border:1px solid var(--bad);background:rgba(255,92,108,.08);color:var(--bad);border-radius:12px;padding:12px 15px;font-size:12.5px;line-height:1.6;margin-bottom:14px}
/* 한 줄 요약 */
.brief{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,var(--soft),transparent);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.brief p{margin:0;font-size:13.5px;line-height:1.65;flex:1;min-width:280px}
.brief p b{font-weight:800}
.brief .lab{display:inline-block;font-size:11px;font-weight:800;color:var(--accent);margin-right:8px;letter-spacing:.02em}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--track);color:var(--sub);white-space:nowrap}
.pill.bad{background:rgba(255,92,108,.12);color:var(--bad)}
.pill.warn{background:rgba(255,182,72,.14);color:var(--warn)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;min-width:0;border-top:3px solid var(--c,var(--accent))}
.k-l{font-size:12px;color:var(--sub);font-weight:650}
.k-v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:6px 0 3px;line-height:1.2}
.k-v em{font-style:normal;font-size:13px;color:var(--sub);font-weight:600;margin-left:3px}
.k-d{font-size:11.5px;font-weight:700;color:var(--sub);min-height:16px}
.k-d.good{color:var(--good)}.k-d.bad{color:var(--bad)}
.k-d span{font-weight:500;color:var(--sub);margin-left:3px}
.k-s{font-size:11px;color:var(--sub);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 섹션 */
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 2px 10px}
.sec h2{font-size:15.5px;margin:0;letter-spacing:-.02em}
.sec span{font-size:11.5px;color:var(--sub)}
.row{display:grid;gap:14px}
.row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.row.wide{grid-template-columns:1.6fr 1fr}
.row.two{grid-template-columns:1fr 1fr}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel.hero{border-top:3px solid var(--c,var(--accent));padding:18px 18px 10px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}
.ph h3{font-size:14.5px;margin:0}
.ph span{font-size:11px;color:var(--sub);white-space:nowrap}
.pd{font-size:11.5px;color:var(--sub);margin:0 0 10px}
.empty{color:var(--sub);font-size:12.5px;padding:26px 4px;text-align:center}
/* 랭킹 */
.rk{padding:11px 0;border-top:1px solid var(--line)}
.rk:first-of-type{border-top:0}
.rk-h{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:9px}
.rk-no{width:24px;height:24px;border-radius:7px;background:var(--track);color:var(--sub);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.rk:first-of-type .rk-no{background:var(--c,var(--accent));color:#fff}
.rk-nm{font-size:14px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-v{font-size:19px;font-weight:800;letter-spacing:-.02em;text-align:right;white-space:nowrap}
.rk-v small{font-size:11px;color:var(--sub);font-weight:600;margin-left:2px}
.rk-bar{height:7px;border-radius:99px;background:var(--track);overflow:hidden;margin:7px 0 6px 33px}
.rk-bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent));opacity:.55}
.rk:first-of-type .rk-bar i{opacity:1}
.rk-s{font-size:11.5px;color:var(--sub);margin-left:33px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-s b{color:var(--text);font-weight:650}
.chg{font-size:10.5px;font-weight:700;color:var(--sub);margin-left:6px}
.chg.up{color:var(--bad)}.chg.dn{color:var(--good)}.chg.new{color:var(--warn)}
.chg.upn{color:var(--accent)}
.tagx{display:inline-block;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px;margin-left:6px;background:rgba(255,92,108,.12);color:var(--bad)}
/* 리뷰 */
.rvlist{display:grid;gap:10px;max-height:640px;overflow:auto;padding-right:4px}
.rv.full .rv-t{display:block;-webkit-line-clamp:unset;overflow:visible;white-space:pre-line}
.rv{border:1px solid var(--line);border-radius:12px;padding:13px 14px;border-left:3px solid var(--c,var(--accent));min-width:0}
.rv-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.rv-tag{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--track);color:var(--c,var(--accent))}
.rv-star{font-size:12px;color:var(--warn);letter-spacing:1px}
.rv-meta{font-size:11px;color:var(--sub);margin-left:auto}
.rv-p{font-size:12.5px;font-weight:700;margin-bottom:5px}
.rv-t{font-size:12.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.rv-m{font-size:11px;color:var(--sub);margin-top:7px}
/* 씨딩 */
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.fs{background:var(--track);border-radius:10px;padding:10px 11px;position:relative;overflow:hidden}
.fs i{position:absolute;left:0;bottom:0;height:3px;background:var(--teal)}
.fs span{display:block;font-size:11px;color:var(--sub);font-weight:650}
.fs b{display:block;font-size:20px;margin-top:3px}
.fs b small{font-size:11px;color:var(--sub);font-weight:600;margin-left:3px}
.camp{font-size:12px;font-weight:700;margin:2px 0 8px;display:flex;justify-content:space-between;gap:8px}
.camp span{color:var(--sub);font-weight:500;font-size:11px}
.sdstat{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-bottom:10px}
.sdstat b{color:var(--text);font-size:13px;margin-left:4px}
.post{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.post b{font-weight:700}
.post small{color:var(--sub);font-size:11px;margin-left:6px}
.post .eng{color:var(--sub);font-size:11.5px;white-space:nowrap}
.post a{font-size:11.5px;white-space:nowrap}
.warnline{margin-top:10px;padding:9px 12px;border-radius:10px;background:rgba(255,182,72,.12);color:var(--warn);font-size:12px;line-height:1.5}
/* 눌러서 보는 요소 */
.click{cursor:pointer;transition:border-color .12s,background .12s}
.click:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpi.click:hover{border-color:var(--c,var(--accent))}
.k-l{display:flex;justify-content:space-between;align-items:center;gap:6px}
.k-go{font-size:10.5px;font-weight:700;color:var(--sub);white-space:nowrap}
.kpi.click:hover .k-go{color:var(--text)}
.rk.click{margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:10px}
.rk.click:hover{background:var(--soft)}
.rk-s.multi{white-space:normal;overflow:visible}
.tagx.click:hover{background:var(--bad);color:#fff}
.post.click:hover{background:var(--soft)}
.post .now{font-size:10px;font-weight:800;color:var(--teal);background:var(--track);border-radius:99px;padding:2px 7px;margin-left:6px}
.post .see{font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap}
/* 팝업 */
.mdl{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.mdl[hidden]{display:none}
.mdl-box{background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.mdl.img .mdl-box{width:min(460px,100%)}
.mdl-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.mdl-h h3{margin:0;font-size:16px;letter-spacing:-.02em}
.mdl-h small{display:block;font-size:11.5px;color:var(--sub);font-weight:500;margin-top:3px}
.mdl-x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);font-size:14px;cursor:pointer;flex:none}
.mdl-x:hover{border-color:var(--accent)}
.mdl-b{padding:16px 18px 20px;overflow:auto}
.m-tabs{margin-bottom:14px;flex-wrap:wrap}
.m-sec{margin-top:18px}
.m-sec:first-child,.m-tabs+.m-sec{margin-top:0}
.m-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.m-h b{font-size:13.5px}
.m-h span{font-size:11px;color:var(--sub)}
.m-note{font-size:11.5px;color:var(--sub);line-height:1.6;margin:8px 0 0}
.m-warn{padding:10px 12px;border-radius:10px;background:rgba(255,182,72,.12);color:var(--warn);font-size:12px;line-height:1.6;margin-bottom:12px}
.pies{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.pies .m-sec{margin-top:0}
.pie{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pie svg{width:170px;height:170px;flex:none}
.pie .sl.click:hover{opacity:.8}
.lg{flex:1;min-width:190px;display:grid;gap:2px}
.lg-r{display:grid;grid-template-columns:12px 1fr auto 44px;align-items:center;gap:8px;font-size:12.5px;padding:5px 7px;border-radius:8px}
.lg-r i{width:10px;height:10px;border-radius:3px}
.lg-r span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-r b{font-weight:700;white-space:nowrap}
.lg-r em{font-style:normal;color:var(--sub);font-size:11.5px;text-align:right}
.lg-r.click:hover{background:var(--soft)}
.lg-r.on{background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.rvd{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.rvd-a{text-align:center}
.rvd-a b{font-size:34px;letter-spacing:-.03em}
.rvd-a span{color:var(--sub);font-size:13px;margin-left:4px}
.rvd-r{display:grid;grid-template-columns:34px 1fr 96px;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.rvd-r .bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.rvd-r .bar i{display:block;height:100%;border-radius:99px;background:var(--warn)}
.rvd-r em{font-style:normal;color:var(--sub);text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ig{width:min(400px,100%);aspect-ratio:4/5;overflow:hidden;position:relative;border-radius:12px;background:#000;margin:0 auto}
.ig iframe{position:absolute;left:-1px;top:-55px;width:calc(100% + 2px);height:calc(100% + 420px);border:0;background:#fff}
.ig-f{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:12px}
.ig-f b{color:var(--text)}
@media(max-width:560px){.rvd{grid-template-columns:1fr}}
/* 차트 */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.foot{margin-top:26px;color:var(--sub);font-size:11px;line-height:1.75;text-align:center}
.skel{height:110px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--track),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.row.three{grid-template-columns:1fr 1fr}}
@media(max-width:780px){.row.three,.row.wide,.row.two{grid-template-columns:1fr}.pies{grid-template-columns:1fr}.post{grid-template-columns:1fr auto;row-gap:4px}.post>span:empty{display:none}.mdl{padding:10px}.mdl-b{padding:14px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{justify-content:center}.k-v{font-size:22px}.funnel{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.wrap{padding:18px 14px 40px}.plabel{min-width:150px}}
</style></head><body><div class="wrap">
<header class="top"><div><h1>CX 통합</h1><div class="sub">고객 반응 · 배송 품질 · SNS 씨딩을 한 장으로 · 매주 금요일 공유</div></div>
<div class="actions"><span class="status" id="status"><i></i><span id="statusText">불러오는 중</span></span><button type="button" class="btn" id="refreshBtn">↻ 새로고침</button><div class="seg theme"><button type="button" id="themeLightBtn" title="라이트 모드">☀️</button><button type="button" id="themeDarkBtn" title="다크 모드">🌙</button></div></div></header>
<div class="controls"><div class="seg" id="modeSeg"><button type="button" data-mode="week">주간</button><button type="button" data-mode="month">월간</button><button type="button" data-mode="year">연간 누적</button></div>
<div class="pnav"><button type="button" id="prevBtn" aria-label="이전 기간">‹</button><div class="plabel"><b id="pLabel">—</b><small id="pSub"></small></div><button type="button" id="nextBtn" aria-label="다음 기간">›</button></div></div>
<div class="banner" id="banner"></div>
<div id="app"><div class="kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
<div class="mdl" id="mdl" hidden><div class="mdl-box" role="dialog" aria-modal="true" aria-labelledby="mdlT"><div class="mdl-h"><h3 id="mdlT"></h3><button type="button" class="mdl-x" id="mdlX" aria-label="닫기">✕</button></div><div class="mdl-b" id="mdlB"></div></div></div>
<div class="foot">주간 = 전주 금요일 ~ 이번 주 목요일 · 비교는 직전 기간의 같은 일수 기준 · 배송 사고율 = (누락+오배송+분실/파손) ÷ 출고 · 카드와 순위를 누르면 상세가 열립니다 · 10분마다 자동 갱신<br><a href="https://docs.google.com/spreadsheets/d/1XA6e37oPd0ER8W4o-HM5OIkoETvh3xhugESKKOmWlf8/edit" target="_blank" rel="noopener">고객 시트 ↗</a> · <a href="https://docs.google.com/spreadsheets/d/1sRKkaT6xPqsuZ_9fVupcwP-bGWTai4VITCgJNJucTxM/edit" target="_blank" rel="noopener">배송 시트 ↗</a> · <a href="https://docs.google.com/spreadsheets/d/1LRc3ip_ak_zuba6RnvQO6U1TkCZV3ctTnFWFPoknPEs/edit" target="_blank" rel="noopener">출고원장 시트 ↗</a></div>
</div>
<script>
(function(){
const IDS={고객:'1XA6e37oPd0ER8W4o-HM5OIkoETvh3xhugESKKOmWlf8',배송:'1sRKkaT6xPqsuZ_9fVupcwP-bGWTai4VITCgJNJucTxM',출고원장:'1LRc3ip_ak_zuba6RnvQO6U1TkCZV3ctTnFWFPoknPEs'};
const SOURCES=[
 {key:'daily',book:'배송',sheets:['일자별'],need:['날짜','출고 합계']},
 {key:'incidents',book:'배송',sheets:['배송사고','클레임'],need:['접수일','구분']},
 {key:'orders',book:'출고원장',sheets:['주문 원장'],need:['출고일자','상품코드']},
 {key:'inquiry',book:'고객',sheets:['고객문의'],need:['문의일','문의 내용']},
 {key:'review',book:'고객',sheets:['리뷰'],need:['리뷰 작성일','별점']},
 {key:'chat',book:'고객',sheets:['채팅상담'],need:['인입일','상담 내용 요약']},
 /* 씨딩: 성함·전화번호·발송주소·운송장(M,N,O,R열)은 불러오지 않습니다 */
 {key:'seeding',book:'고객',sheets:['SNS 씨딩'],need:['씨딩ID','섭외 상태'],tq:'select A,B,C,D,E,F,G,H,I,J,K,L,P,Q,S,T,U,V,W,X,Y'},
 /* 선택: 반품·교환 제품별 내역. 배송 시트에 '반품교환' 탭(접수일 · 구분 · 제품 · 수량)이 생기면 자동으로 읽습니다. 없어도 오류가 아닙니다 */

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function locate(h,key){key=norm(key);let i=h.indexOf(key);if(i<0)i=h.findIndex(x=>x.endsWith(key));if(i<0)i=h.findIndex(x=>x.includes(key));return i}
function toTable(rows,need){for(let r=0;r<Math.min(rows.length,8);r++){const h=rows[r].map(norm);if(need.every(k=>locate(h,k)>=0))return{h,rows:rows.slice(r+1),idx:{}}}throw new Error('머리글 없음')}
function jsonp(url){return new Promise((res,rej)=>{const cb='__gv'+Math.random().toString(36).slice(2);const s=document.createElement('script');const tm=setTimeout(()=>{done();rej(new Error('timeout'))},20000);function done(){clearTimeout(tm);try{delete window[cb]}catch(e){}s.remove()}window[cb]=d=>{done();if(!d||d.status==='error'||!d.table)rej(new Error('gviz'));else res(d.table)};s.onerror=()=>{done();rej(new Error('load'))};s.src=url.replace('tqx=out:csv','tqx=responseHandler:'+cb);document.head.appendChild(s)})}
function tableFromJson(t){const head=t.cols.map(c=>c.label||'');return[head,...t.rows.map(r=>(r.c||[]).map(c=>c?(c.f!=null?c.f:(c.v==null?'':String(c.v))):''))]}
async function fetchSource(s){
  const variants=[];
  for(const sh of s.sheets){const base='https://docs.google.com/spreadsheets/d/'+IDS[s.book]+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(sh);if(s.tq)variants.push(base+'&tq='+encodeURIComponent(s.tq));variants.push(base);if(!s.optional)variants.push(base+'&headers=1&range=A2:AZ')}
  for(const u of variants){try{const r=await fetch(u+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const txt=await r.text();if(/^\s*</.test(txt))throw 0;return toTable(parseCSV(txt),s.need)}catch(e){}}
  for(const u of variants){try{return toTable(tableFromJson(await jsonp(u)),s.need)}catch(e){}}
  throw new Error(s.key);
}

function pdate(v){const m=String(v||'').match(/(\d{2,4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);if(!m)return null;let y=+m[1];if(y<100)y+=2000;const mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return null;return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}

  const chat=mapRows(T.chat,g=>{const d=pdate(g('인입일'));const text=g('상담 내용 요약');if(!d||!text)return null;return{d,src:'채팅',ch:g('채널'),product:g('제품'),opt:g('기종·옵션'),text}});

const toS=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');

/* entries: [[이름, 값], …] 값 큰 순. o.pick=true면 조각·범례를 눌러 선택 */

    else{const lg=fr>.5?1:0;s+='<path d="M'+pt(RO,a)+'A'+RO+' '+RO+' 0 '+lg+' 1 '+pt(RO,b)+'L'+pt(RI,b)+'A'+RI+' '+RI+' 0 '+lg+' 0 '+pt(RI,a)+'Z" stroke="var(--card)" stroke-width="1.5"'+at+'</path>'}
    a=b});

      +'<div class="sdstat"><span>게시 계정 도달<b>'+fmt(reach)+'</b></span><span>좋아요+댓글<b>'+fmt(eng)+'</b></span><span>발송 제품 원가<b>₩'+fmt(cost)+'</b></span>'+(eng&&cost?'<span>반응 1건당<b>₩'+fmt(cost/eng)+'</b></span>':'')+'</div>'
      +(posts.length?posts.map((x,i)=>{const ig=igPath(x.url);return'<div class="post'+(ig?' click" data-open="post" data-arg="'+i+'" role="button" tabindex="0" aria-label="'+esc(x.acc)+' 게시물 이미지 보기':'')+'"><span><b>'+esc(x.acc)+'</b><small>팔로워 '+fmt(x.fol)+(x.pd?' · '+md(x.pd)+' 게시':'')+'</small>'+(x.pd&&inR(x.pd,cur)?'<span class="now">이번 '+unit+'</span>':'')+'</span><span class="eng">♥ '+fmt(x.likes)+' · 💬 '+fmt(x.cmts)+'</span>'+(ig?'<span class="see">이미지 보기</span>':'<span></span>')+(/^https?:\/\//.test(x.url)?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">게시물 ↗</a>':'<span></span>')+'</div>'}).join(''):'<div class="pd" style="margin:4px 0 0">아직 게시된 계정이 없습니다.</div>')
      +(overdue.length?'<div class="warnline">게시 약속일이 지났는데 아직 미게시 <b>'+overdue.length+'명</b> · '+esc(overdue.slice(0,4).map(x=>x.acc).join(', '))+(overdue.length>4?' 외 '+(overdue.length-4)+'명':'')+'</div>':'');
  }

  /* 한 줄 요약 + 확인 필요 */

   +panel('hero','var(--accent)','많이 나간 제품 TOP 5',fmt(otot)+'개','주문 원장 출고 수량 · 옵션 합산',sales)
   +'</div>'

   +'<div class="row two">'+panel('','var(--bad)','낮은 별점 리뷰',lows.length+'건','3점 이하 리뷰를 별점이 낮은 순으로 모았습니다.',rvList(lows,'이 기간에는 3점 이하 리뷰가 없습니다.'))
   +panel('','var(--accent)','높은 별점 주목할 리뷰',highs.length+'건','4점 이상 중 재구매 · 구매 동기 · B2B 신호 등 다른 팀이 활용할 만한 리뷰입니다.',rvList(highs,'이 기간에는 4점 이상 리뷰가 없습니다.'))+'</div>'
   +'<div class="sec"><h2>운영 · 마케팅 현황</h2></div>'

let loading=false;
async function load(){
  if(loading)return;loading=true;
  $('status').className='status';$('statusText').textContent='불러오는 중';
  let T={},failed=[];
  if(window.CX_TEST_TABLES){for(const s of SOURCES){try{T[s.key]=toTable(window.CX_TEST_TABLES[s.key],s.need)}catch(e){if(!s.optional)failed.push(s.key)}}}
  else{const res=await Promise.allSettled(SOURCES.map(fetchSource));res.forEach((r,i)=>{if(r.status==='fulfilled')T[SOURCES[i].key]=r.value;else if(!SOURCES[i].optional)failed.push(SOURCES[i].key)})}
  loading=false;
  if(failed.length>=SOURCES.filter(s=>!s.optional).length&&D){$('status').className='status err';$('statusText').textContent='연결 실패 · 이전 데이터 표시';return}
  const firstLoad=!D;build(T);if(firstLoad||!state.anchor)state.anchor=defaultAnchor(state.mode);
  const now=new Date();
  $('status').className='status '+(failed.length?'err':'live');
  $('statusText').textContent=(failed.length?'일부 연결 실패':'실시간')+' · '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+' 갱신';
  const bn=$('banner');
  if(failed.length){bn.style.display='block';bn.innerHTML='<b>다음 탭을 불러오지 못했습니다:</b> '+failed.map(k=>esc(LABEL[k])).join(', ')+'<br>시트 공유가 “링크가 있는 모든 사용자 · 뷰어”인지, 탭 이름과 머리글이 바뀌지 않았는지 확인해 주세요.'}else bn.style.display='none';
  render();
}
document.querySelectorAll('#modeSeg button').forEach(b=>b.addEventListener('click',()=>{if(!D)return;state.mode=b.dataset.mode;state.anchor=defaultAnchor(state.mode);render()}));
$('prevBtn').onclick=()=>{const p=shift(state.mode,periodOf(state.mode,state.anchor),-1);state.anchor=p.start;render()};
$('nextBtn').onclick=()=>{const p=shift(state.mode,periodOf(state.mode,state.anchor),1);state.anchor=minS(p.start,LAST);render()};
$('refreshBtn').onclick=load;

/* ---------- 팝업 열고 닫기 ---------- */
let lastFocus=null;
function openM(type,arg,tab){if(!CTX||!MODALS[type])return;lastFocus=document.activeElement;M={type,arg,tab};drawM();$('mdl').hidden=false;document.body.style.overflow='hidden';$('mdlX').focus()}
function closeM(){M=null;$('mdl').hidden=true;$('mdlB').innerHTML='';document.body.style.overflow='';if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}
document.addEventListener('click',e=>{
  if(e.target.closest('a'))return;
  const mdl=$('mdl');
  if(mdl.contains(e.target)){
    if(e.target===mdl||e.target.closest('#mdlX')){closeM();return}
    const tb=e.target.closest('[data-tab]');if(tb&&M){M.tab=tb.dataset.tab;drawM();return}
    const pk=e.target.closest('[data-pick]');if(pk&&M){M.arg=pk.dataset.pick;drawM()}
    return;
  }
  const t=e.target.closest('[data-open]');if(t)openM(t.dataset.open,t.dataset.arg,t.dataset.tab);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&M){closeM();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-open],[role="button"][data-pick]')){e.preventDefault();e.target.click()}
});

setInterval(()=>{if(!document.hidden)load()},10*60*1000);
window.__fbCXSetTab=function(){window.scrollTo({top:0,behavior:'smooth'})};

/* ---------- 테마 ---------- */
function syncTheme(){const t=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';$('themeLightBtn').classList.toggle('active',t==='light');$('themeDarkBtn').classList.toggle('active',t==='dark');document.querySelector('meta[name="theme-color"]').content=t==='light'?'#f5f6f8':'#12151c'}
function setTheme(v){document.documentElement.setAttribute('data-theme',v);try{localStorage.setItem('theme',v)}catch(e){}syncTheme()}

new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});syncTheme();
load();
})();

        const items = dept.groups ? dept.groups.flatMap(group => group.items) : dept.items;
        const item = items.find(it => it.tab === hashTab) || items.find(it => it.tab === "overview") || items[0];
        return { deptId: dept.id, itemId: item ? item.id : null };
      }
      const items = dept.groups ? dept.groups.flatMap(group => group.items) : dept.items;
      for (const item of items) {
        if (item.url && repoSegmentOf(item.url) === currentSeg) {
          return { deptId: dept.id, itemId: item.id };
        }
      }
    }


    return {

      deptId: null,

      itemId: null

    };

  }


  let active =
    detectActive();


  let openDeptId =
    active.deptId;


  /* =========================================================
     테마
     ========================================================= */

  function getTheme() {

    const htmlTheme =
      document.documentElement
        .getAttribute("data-theme");


    if (
      htmlTheme === "light" ||
      htmlTheme === "dark"
    ) {

      return htmlTheme;

    }


    try {

      const saved =
        localStorage.getItem(THEME_KEY);


      if (
        saved === "light" ||
        saved === "dark"
      ) {

        return saved;

      }

    }

    catch (e) {}


    return "dark";

  }


  function restoreTheme() {

    try {

      let saved =
        localStorage.getItem(THEME_KEY);

      /* 예전 홈에서 사용하던 키가 남아 있으면 공통 키로 한 번만 이전합니다. */
      if (saved !== "light" && saved !== "dark") {

        const legacySaved =
          localStorage.getItem(LEGACY_HOME_THEME_KEY);

        if (
          legacySaved === "light" ||
          legacySaved === "dark"
        ) {

          saved = legacySaved;
          localStorage.setItem(THEME_KEY, saved);

        }

      }

      localStorage.removeItem(LEGACY_HOME_THEME_KEY);


      if (
        saved === "light" ||
        saved === "dark"
      ) {

        document.documentElement
          .setAttribute(
            "data-theme",
            saved
          );

      }

    }

    catch (e) {}

  }


  function saveTheme(theme) {

    if (
      theme !== "light" &&
      theme !== "dark"
    ) {

      return;

    }


    try {

      localStorage.setItem(
        THEME_KEY,
        theme
      );

    }

    catch (e) {}

  }


  function syncSidebarTheme() {

    const sidebar =
      document.getElementById(
        SIDEBAR_ID
      );


    if (!sidebar) return;


    const theme =
      getTheme();


    sidebar.dataset.theme =
      theme;


    if (!THEME_BOOT_LOCKED) {

      saveTheme(theme);

    }


    const logo =
      sidebar.querySelector(
        ".fb-brand-logo"
      );


    if (logo) {

      logo.src =
        theme === "light"
          ? LOGO_BLACK
          : LOGO_WHITE;

    }

  }


  /* =========================================================
     사이드바 접기 상태
     ========================================================= */

  function isCollapsed() {

    try {

      return (
        localStorage.getItem(
          COLLAPSE_KEY
        ) === "1"
      );

    }

    catch (e) {

      return false;

    }

  }


  function setCollapsed(value) {

    try {

      localStorage.setItem(
        COLLAPSE_KEY,
        value ? "1" : "0"
      );

    }

    catch (e) {}

  }

  /* =========================================================
     본문 위치
     ========================================================= */

  function applyBodyOffset() {

    document.body
      .classList
      .add(
        "fb-has-sidebar"
      );


    document.body
      .classList
      .toggle(
        "fb-sidebar-collapsed",
        isCollapsed()
      );

  }



  /* =========================================================
     링크
     ========================================================= */

  function itemHref(
    dept,
    item
  ) {

    if (item.tab) {

      const deptSeg =
        repoSegmentOf(
          dept.baseUrl
        );


      if (
        deptSeg === currentSeg
      ) {

        return "#" + item.tab;

      }


      return (
        dept.baseUrl +
        "#" +
        item.tab
      );

    }


    return item.url;

  }



  function onItemClick(
    ev,
    dept,
    item
  ) {

    if (!item.tab) {

      return;

    }


    const deptSeg =
      repoSegmentOf(
        dept.baseUrl
      );


    if (
      deptSeg !== currentSeg
    ) {

      return;

    }


    ev.preventDefault();


    const setTab = dept.id === "cx" ? window.__fbCXSetTab : window.__fbOperationSetTab;
    if (typeof setTab === "function") setTab(item.tab);


    try {

      history.replaceState(
        null,
        "",
        "#" + item.tab
      );

    }

    catch (e) {

      location.hash =
        item.tab;

    }


    active = {

      deptId: dept.id,

      itemId: item.id

    };


    updateActiveHighlight();

  }



  /* =========================================================
     아코디언
     ========================================================= */

  function openExclusively(
    deptId
  ) {

    openDeptId =
      deptId;


    document
      .querySelectorAll(
        `#${SIDEBAR_ID} .fb-dept`
      )
      .forEach(el => {

        el.classList.toggle(
          "open",
          el.dataset.dept === deptId
        );

      });

  }



  /* =========================================================
     렌더링
     ========================================================= */

  function render() {

    const sidebar =
      document.createElement("nav");


    sidebar.id =
      SIDEBAR_ID;


    if (
      isCollapsed()
    ) {

      sidebar.classList
        .add("collapsed");

    }



    /* 상단 */

    const top =
      document.createElement("div");


    top.className =
      "fb-sb-top";


    const initialLogo =
      getTheme() === "light"
        ? LOGO_BLACK
        : LOGO_WHITE;


    top.innerHTML = `

      <a
        class="fb-sb-home"
        href="${HOME_URL}"
        aria-label="FRAME BY 홈"
      >

        <img
          class="fb-brand-logo"
          src="${initialLogo}"
          alt="FRAME BY"
        >

        <span class="label">
          FRAME BY
        </span>

      </a>


      <button
        class="fb-sb-toggle"
        type="button"
        title="사이드바 접기/펼치기"
      >

        ${
          isCollapsed()
            ? "»"
            : "«"
        }

      </button>

    `;



    const toggleBtn =
      top.querySelector(
        ".fb-sb-toggle"
      );


    toggleBtn
      .addEventListener(
        "click",
        () => {

          const collapsed =
            !sidebar.classList
              .contains(
                "collapsed"
              );


          sidebar.classList
            .toggle(
              "collapsed",
              collapsed
            );


          document.body
            .classList
            .toggle(
              "fb-sidebar-collapsed",
              collapsed
            );


          setCollapsed(
            collapsed
          );


          toggleBtn.textContent =
            collapsed
              ? "»"
              : "«";

        }
      );


    sidebar
      .appendChild(top);



    /* 메뉴 */

    const body =
      document.createElement("div");


    body.className =
      "fb-sb-body";



    DEPARTMENTS
      .forEach(
        dept => {


          const wrap =
            document.createElement(
              "div"
            );


          wrap.className =
            "fb-dept" +
            (
              openDeptId ===
              dept.id
                ? " open"
                : ""
            );


          wrap.dataset.dept =
            dept.id;



          /* 부서명 */

          const head =
            document.createElement(
              "button"
            );


          head.type =
            "button";


          head.className =
            "fb-dept-head";


          head.innerHTML = `

            <span
              class="fb-dept-collapsed-mark"
            >

              ${
                dept.name
                  .charAt(0)
                  .toUpperCase()
              }

            </span>


            <span
              class="fb-dept-name"
            >

              ${dept.name}

            </span>


            <span
              class="fb-dept-caret"
            >
              ▸
            </span>

          `;



          head.addEventListener(
            "click",
            () => {


              if (
                sidebar.classList
                  .contains(
                    "collapsed"
                  )
              ) {

                sidebar.classList
                  .remove(
                    "collapsed"
                  );


                document.body
                  .classList
                  .remove(
                    "fb-sidebar-collapsed"
                  );


                setCollapsed(
                  false
                );


                toggleBtn
                  .textContent =
                  "«";

              }


              const willOpen =
                !wrap.classList
                  .contains(
                    "open"
                  );


              openExclusively(
                willOpen
                  ? dept.id
                  : null
              );

            }
          );


          wrap
            .appendChild(head);



          /* 하위 메뉴 */

          const itemsOuter =
            document.createElement(
              "div"
            );


          itemsOuter.className =
            "fb-dept-items";


          const itemsInner =
            document.createElement(
              "div"
            );


          itemsInner.className =
            "fb-dept-items-inner";



          const addItem = (item, target, nested = false) => {
            const a = document.createElement("a");
            a.className = "fb-item" + (nested ? " fb-item-nested" : "");
            a.dataset.dept = dept.id;
            a.dataset.item = item.id;
            a.href = itemHref(dept, item);
            const dot = document.createElement("span");
            dot.className = "fb-item-dot";
            const label = document.createElement("span");
            label.textContent = item.name;
            a.append(dot, label);
            a.addEventListener("click", ev => onItemClick(ev, dept, item));
            target.appendChild(a);
          };
          if (dept.groups) {
            dept.groups.forEach(group => {
              const groupWrap = document.createElement("div");
              groupWrap.className = "fb-menu-group";
              groupWrap.dataset.group = group.id;
              const groupHead = document.createElement("button");
              groupHead.type = "button";
              groupHead.className = "fb-group-head";
              groupHead.textContent = group.name;
              groupHead.setAttribute("aria-expanded", "false");
              groupHead.addEventListener("click", () => {
                const opening = !groupWrap.classList.contains("open");
                itemsInner.querySelectorAll(".fb-menu-group").forEach(el => {
                  el.classList.remove("open");
                  el.querySelector(".fb-group-head")?.setAttribute("aria-expanded", "false");
                });
                groupWrap.classList.toggle("open", opening);
                groupHead.setAttribute("aria-expanded", String(opening));
              });
              const children = document.createElement("div");
              children.className = "fb-group-items";
              group.items.forEach(item => addItem(item, children, true));
              groupWrap.append(groupHead, children);
              itemsInner.appendChild(groupWrap);
            });
          } else {
            dept.items.forEach(item => addItem(item, itemsInner));
          }


          itemsOuter
            .appendChild(
              itemsInner
            );


          wrap
            .appendChild(
              itemsOuter
            );


          body
            .appendChild(
              wrap
            );

        }
      );


    sidebar
      .appendChild(body);


    document.body
      .insertBefore(
        sidebar,
        document.body.firstChild
      );


    syncSidebarTheme();

    updateActiveHighlight();

  }



  /* =========================================================
     현재 메뉴 강조
     ========================================================= */

  function updateActiveHighlight() {

    document.querySelectorAll(`#${SIDEBAR_ID} .fb-menu-group`).forEach(group => {
      if (group.querySelector(`.fb-item[data-item="${active.itemId}"]`)) {
        group.classList.add("open");
        group.querySelector(".fb-group-head")?.setAttribute("aria-expanded", "true");
      }
    });

    document
      .querySelectorAll(
        `#${SIDEBAR_ID} .fb-item`
      )
      .forEach(
        el => {

          el.classList.toggle(

            "active",

            el.dataset.dept ===
              active.deptId &&

            el.dataset.item ===
              active.itemId

          );

        }
      );

  }



  /* =========================================================
     실행
     ========================================================= */

  function boot() {

    if (
      document.getElementById(
        SIDEBAR_ID
      )
    ) {

      return;

    }


    restoreTheme();

    injectStyle();

    render();

    applyBodyOffset();

    syncSidebarTheme();



    /* data-theme 변경 감시 */

    const themeObserver =
      new MutationObserver(
        () => {

          syncSidebarTheme();

        }
      );


    themeObserver.observe(

      document.documentElement,

      {

        attributes:true,

        attributeFilter:[
          "data-theme"
        ]

      }

    );


    /*
     * 일부 대시보드는 로딩 과정에서 data-theme="dark"를 다시 넣습니다.
     * 모든 초기 스크립트가 끝난 뒤 저장된 공통 테마를 한 번 더 적용하고,
     * 그 이후의 변경만 사용자가 선택한 값으로 저장합니다.
     */
    const finishThemeBoot = () => {

      window.setTimeout(
        () => {

          document.documentElement.setAttribute(
            "data-theme",
            INITIAL_SAVED_THEME
          );
          saveTheme(INITIAL_SAVED_THEME);
          THEME_BOOT_LOCKED = false;
          syncSidebarTheme();

        },
        250
      );

    };


    if (document.readyState === "complete") {

      finishThemeBoot();

    } else {

      window.addEventListener(
        "load",
        finishThemeBoot,
        { once:true }
      );

    }



    /* 다른 탭에서 테마 변경 */

    window.addEventListener(
      "storage",
      e => {

        if (
          e.key === THEME_KEY &&
          (
            e.newValue === "light" ||
            e.newValue === "dark"
          )
        ) {

          document.documentElement
            .setAttribute(
              "data-theme",
              e.newValue
            );


          syncSidebarTheme();

        }

      }
    );



    /* 사이드바 삭제 시 복구 */

    const bodyObserver =
      new MutationObserver(
        () => {

          if (
            !document.getElementById(
              SIDEBAR_ID
            )
          ) {

            render();

            applyBodyOffset();

            syncSidebarTheme();

          }

        }
      );


    bodyObserver.observe(

      document.body,

      {
        childList:true
      }

    );



    /* Operation 해시 */

    window.addEventListener(
      "hashchange",
      () => {

        active =
          detectActive();


        if (
          active.deptId
        ) {

          openExclusively(
            active.deptId
          );

        }


        updateActiveHighlight();

      }
    );

  }



  if (
    document.body
  ) {

    boot();

  }

  else {

    document.addEventListener(
      "DOMContentLoaded",
      boot
    );

  }


})();

</script>
</body></html>

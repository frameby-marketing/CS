<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--text:#e8eaed;--sub:#9aa1ac;--accent:#4c8dff;--accent2:#8b7bf0;--good:#3ecf8e;--bad:#ff5c6c;--warn:#ffb648;--teal:#20b58b;--track:#262b36;--grid:#242832;--soft:rgba(76,141,255,.10);--tipbg:#0b0d12}

/* ---------- 시트 불러오기 ---------- */
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}

function jsonp(url){return new Promise((res,rej)=>{const cb='__gv'+Math.random().toString(36).slice(2);const s=document.createElement('script');const tm=setTimeout(()=>{done();rej(new Error('timeout'))},20000);function done(){clearTimeout(tm);try{delete window[cb]}catch(e){}s.remove()}window[cb]=d=>{done();if(!d||d.status==='error'||!d.table)rej(new Error('gviz'));else res(d.table)};s.onerror=()=>{done();rej(new Error('load'))};s.src=url.replace('tqx=out:csv','tqx=responseHandler:'+cb);document.head.appendChild(s)})}
function tableFromJson(t){const head=t.cols.map(c=>c.label||'');return[head,...t.rows.map(r=>(r.c||[]).map(c=>c?(c.f!=null?c.f:(c.v==null?'':String(c.v))):''))]}
async function fetchSource(s){

  for(const u of variants){try{const r=await fetch(u+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const txt=await r.text();if(/^\s*</.test(txt))throw 0;return toTable(parseCSV(txt),s.need)}catch(e){}}

const get=(t,r,k)=>{let i=t.idx[k];if(i===undefined)i=t.idx[k]=locate(t.h,k);return i>=0?norm(r[i]):''};
const mapRows=(t,fn)=>t?t.rows.map(r=>fn(k=>get(t,r,k))).filter(Boolean):[];
function pdate(v){const m=String(v||'').match(/(\d{2,4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);if(!m)return null;let y=+m[1];if(y<100)y+=2000;const mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return null;return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}

/* ---------- 데이터 정리 ---------- */
let D=null,LAST=null,TODAY=null,FIRST={},state={mode:'week',anchor:null};
function build(T){
  const daily=mapRows(T.daily,g=>{const d=pdate(g('날짜'));if(!d)return null;const own=num(g('자사몰 출고')),cp=num(g('쿠팡 출고')),out=num(g('출고 합계'))||own+cp,miss=num(g('누락')),wrong=num(g('오배송')),dmg=num(g('파손'));return{d,out,own,cp,miss,wrong,dmg,inc:Math.max(miss+wrong+dmg,num(g('사고 합계'))),ret:num(g('반품')),exch:num(g('교환'))}});
  const incidents=mapRows(T.incidents,g=>{const d=pdate(g('접수일'));if(!d)return null;return{d,type:g('구분'),done:!!pdate(g('처리 완료일'))}});
  const orders=mapRows(T.orders,g=>{const d=pdate(g('출고일자'));const code=g('상품코드');if(!d||!code)return null;return{d,code,name:g('주문 내역'),qty:num(g('수량'))||1}});
  const inquiry=mapRows(T.inquiry,g=>{const d=pdate(g('문의일'));const text=g('문의 내용');if(!d||!text)return null;return{d,src:'문의',ch:g('채널'),product:g('제품'),opt:g('기종·옵션'),text}});
  const chat=mapRows(T.chat,g=>{const d=pdate(g('인입일'));const text=g('상담 내용 요약');if(!d||!text)return null;return{d,src:'채팅',ch:g('채널'),product:g('제품'),opt:g('기종·옵션'),text}});
  const review=mapRows(T.review,g=>{const d=pdate(g('리뷰 작성일'));const star=num(g('별점'));if(!d||!star)return null;return{d,src:'리뷰',ch:g('채널'),product:g('제품'),opt:g('기종·옵션'),star,text:g('리뷰 내용'),memo:g('처리 메모'),imp:!!g('중요')}});
  const weekly=mapRows(T.weekly,g=>{const m=g('기간').match(/(\d{2,4})\.(\d{1,2})\.(\d{1,2})\s*[-~]\s*(?:(\d{2,4})\.)?(\d{1,2})\.(\d{1,2})/);if(!m)return null;const y=+m[1]<100?2000+ +m[1]:+m[1];const p=(a,b,c)=>a+'-'+String(b).padStart(2,'0')+'-'+String(c).padStart(2,'0');return{start:p(y,m[2],m[3]),end:p(m[4]?(+m[4]<100?2000+ +m[4]:+m[4]):y,m[5],m[6]),label:g('기간'),bad:g('불만 TOP3'),good:g('칭찬 TOP3'),note:g('이상 / 해석')}});
  const seeding=mapRows(T.seeding,g=>{const id=g('씨딩ID'),acc=g('계정');if(!/^S-/i.test(id)&&!/^@/.test(acc))return null;const st=g('상태');const posted=pdate(g('실제 게시일'));const ship=g('제품 발송 상태');return{id,camp:g('캠페인')||'캠페인 미기재',acc,fol:num(g('팔로워')),cat:g('카테고리'),confirmed:/완료/.test(g('섭외 상태')),cd:pdate(g('섭외 확정일')),sent:/발송/.test(ship)&&/완료/.test(ship)||!!pdate(g('발송일')),sd:pdate(g('발송일')),due:pdate(g('게시 약속일')),posted:posted||(/게시\s*완료/.test(st)?(pdate(g('발송일'))||''):null),pd:posted,url:g('게시 URL'),likes:num(g('좋아요')),cmts:num(g('댓글')),cost:num(g('원가'))*(num(g('수량'))||1)}});
  D={daily,incidents,orders,inquiry,chat,review,weekly,seeding};
  const shipDays=daily.filter(r=>r.out>0).map(r=>r.d);
  const mn=a=>a.length?a.reduce((x,y)=>x<y?x:y):null;
  FIRST={daily:mn(shipDays)};
  ['inquiry','chat','review','orders'].forEach(k=>FIRST[k]=mn(D[k].map(r=>r.d)));
  TODAY=toS(new Date());
  const all=[...shipDays,...inquiry.map(r=>r.d),...chat.map(r=>r.d),...review.map(r=>r.d)].filter(d=>d<=TODAY);
  LAST=all.length?all.reduce((a,b)=>a>b?a:b):TODAY;
  FIRST.any=[FIRST.daily,FIRST.inquiry,FIRST.orders].filter(Boolean).sort()[0]||LAST;
}

/* ---------- 기간 (주간 = 금요일 ~ 목요일) ---------- */
const toD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const toS=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const addDays=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return toS(d)};
const diffDays=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const minS=(a,b)=>a<b?a:b;
function periodOf(mode,s){const d=toD(s);if(mode==='week'){const st=addDays(s,-((d.getDay()-5+7)%7));return{start:st,end:addDays(st,6)}}if(mode==='month')return{start:toS(new Date(d.getFullYear(),d.getMonth(),1,12)),end:toS(new Date(d.getFullYear(),d.getMonth()+1,0,12))};return{start:d.getFullYear()+'-01-01',end:d.getFullYear()+'-12-31'}}
function shift(mode,p,k){const d=toD(p.start);if(mode==='week')return periodOf(mode,addDays(p.start,7*k));if(mode==='month')return periodOf(mode,toS(new Date(d.getFullYear(),d.getMonth()+k,1,12)));return periodOf(mode,toS(new Date(d.getFullYear()+k,0,1,12)))}
/* 금요일 보고 기준: 기본 화면은 '어제'가 속한 주 → 금요일에 열면 방금 끝난 주(금~목)가 보입니다 */
const defaultAnchor=mode=>mode==='week'?minS(LAST,addDays(TODAY,-1)):LAST;
const W='일월화수목금토';
const md=s=>{const d=toD(s);return(d.getMonth()+1)+'/'+d.getDate()};
const mdw=s=>md(s)+'('+W[toD(s).getDay()]+')';
const inR=(d,r)=>d>=r.start&&d<=r.end;

/* ---------- 집계 ---------- */
function metrics(r){
  const dl=D.daily.filter(x=>inR(x.d,r)),s=k=>dl.reduce((t,x)=>t+x[k],0);
  const out=s('out'),inc=s('inc'),ret=s('ret'),exch=s('exch');
  const inq=D.inquiry.filter(x=>inR(x.d,r)),ch=D.chat.filter(x=>inR(x.d,r)),rv=D.review.filter(x=>inR(x.d,r));
  return{out,own:s('own'),cp:s('cp'),inc,miss:s('miss'),wrong:s('wrong'),dmg:s('dmg'),ret,exch,
    incRate:out?inc/out:null,reRate:out?(ret+exch)/out:null,inq:inq.length,chat:ch.length,voice:inq.length+ch.length,
    rv,reviews:rv.length,avg:rv.length?rv.reduce((t,x)=>t+x.star,0)/rv.length:null,low:rv.filter(x=>x.star<=3).length,
    voices:[...inq,...ch,...rv.filter(x=>x.star<=3)],asks:[...inq,...ch],
    orders:D.orders.filter(x=>inR(x.d,r))};
}
const covered=(k,r)=>FIRST[k]&&FIRST[k]<=r.start;

const TOPICS=[
 {n:'힌지·크랙',re:/힌지|크랙|금이|금 간|금간|금가/},
 {n:'자석 분리·불량',re:/자석/},
 {n:'파손·내구성',re:/파손|깨[지졌짐]|찢어|불량|고장|헐거|충격|보호/},
 {n:'마감·포장',re:/마감|찌그러|흠집|스크래치|기스|포장|변색|들뜸|유격/},
 {n:'배송',re:/배송 ?지연|누락|오배송|택배|도착|안 ?와/},
 {n:'가격·할인',re:/가격|할인|비싸|금액|쿠폰/},
 {n:'재입고·품절',re:/재입고|입고|품절|단종|언제 들어|출시/},
 {n:'호환·사용법',re:/호환|거치|가능할까|가능한가|사이즈|인치|무게|닫히지|방법|사용 가능/}
];
const RESTOCK=/재입고|입고|품절|단종|언제 들어|출시/;
const topicOf=text=>{for(const t of TOPICS)if(t.re.test(text))return t.n;return'기타'};
const topN=(map,n)=>Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n);
const inc1=(o,k,v=1)=>{o[k]=(o[k]||0)+v};
function models(x){const tags=[];const re=/(?:아이폰|iphone)\s*(\d{2})\s*(프로\s*맥스|프로맥스|pro\s*max|프로|pro|미니|mini|플러스|plus|에어|air)?/gi;let m;const src=x.opt+' '+x.text;while((m=re.exec(src)))tags.push('아이폰 '+m[1]+(m[2]?' '+m[2].replace(/\s+/g,'').replace(/promax/i,'프로맥스').replace(/^pro$/i,'프로').replace(/^mini$/i,'미니').replace(/^plus$/i,'플러스').replace(/^air$/i,'에어'):''));if(!tags.length&&x.opt&&x.opt!=='—'&&x.opt.length<=18)tags.push(x.opt);return tags}
const cleanName=s=>String(s).replace(/^프레임바이\s*/,'').split(/\s*(?:기종\s*[:=]|[=\/:(\[])\s*/)[0].trim();
const prodGroup=code=>(code.split('-')[0]||code).toUpperCase();
const optOf=code=>{const p=code.split('-');return p.length>2?p.slice(1,-1).join('-'):(p[1]||'')};
function chgTag(cur,prev,show,kind){ // kind: issue(증가=나쁨) / sales(증가=좋음)
  if(!show)return'';
  if(!prev)return'<span class="chg new">신규</span>';
  const d=cur-prev;if(!d)return'<span class="chg">전 기간과 같음</span>';
  if(kind==='sales'){const r=d/prev;return'<span class="chg '+(d>0?'upn':'')+'">'+(d>0?'▲':'▼')+Math.abs(r*100).toFixed(0)+'%</span>'}
  return'<span class="chg '+(d>0?'up':'dn')+'">'+(d>0?'▲':'▼')+Math.abs(d)+'</span>';
}

/* ---------- 렌더 조각 ---------- */
let CMP='';
function delta(cur,prev,kind,good){
  if(cur==null||prev==null)return'<div class="k-d">&nbsp;</div>';
  let v,txt;
  if(kind==='count'){if(!prev)return'<div class="k-d">&nbsp;</div>';v=(cur-prev)/prev;txt=(v>=0?'▲ ':'▼ ')+Math.abs(v*100).toFixed(0)+'%'}
  else if(kind==='rate'){v=cur-prev;txt=(v>=0?'▲ ':'▼ ')+Math.abs(v*100).toFixed(2)+'%p'}
  else{v=cur-prev;txt=(v>=0?'▲ ':'▼ ')+Math.abs(v).toFixed(2)+'점'}
  if(Math.abs(v)<1e-9)txt='– 변동 없음';
  const cls=Math.abs(v)<1e-9||!good?'':((good==='low')===(v<0)?'good':'bad');
  return'<div class="k-d '+cls+'">'+txt+'<span>'+CMP+'</span></div>';
}
const kpi=(label,value,unit,d,subline,color)=>'<div class="kpi" style="--c:'+color+'"><div class="k-l">'+esc(label)+'</div><div class="k-v">'+esc(value)+'<em>'+esc(unit)+'</em></div>'+d+'<div class="k-s" title="'+esc(subline)+'">'+esc(subline)+'</div></div>';
const rk=(i,name,val,unit,width,sub,extra)=>'<div class="rk"><div class="rk-h"><span class="rk-no">'+(i+1)+'</span><span class="rk-nm" title="'+esc(name)+'">'+esc(name)+'</span><span class="rk-v">'+fmt(val)+'<small>'+unit+'</small>'+(extra||'')+'</span></div><div class="rk-bar"><i style="width:'+Math.max(4,width)+'%"></i></div>'+(sub?'<div class="rk-s">'+sub+'</div>':'')+'</div>';
const panel=(cls,color,title,right,desc,body)=>'<section class="panel '+cls+'" style="--c:'+color+'"><div class="ph"><h3>'+title+'</h3><span>'+right+'</span></div><p class="pd">'+desc+'</p>'+body+'</section>';

/* 주목할 리뷰 고르기 */
const PRAISE=[[/세\s?번째|두\s?번째|재구매|또 ?샀|또 ?구매|하나 더|추가 ?구매|\d번째/,'재구매 고객','var(--teal)'],[/목|허리|자세|디스크|어깨|거북/,'구매 동기 · 자세','var(--accent)'],[/회사|직원|사무실|단체|대량/,'B2B 신호','var(--accent2)'],[/선물/,'선물 수요','var(--accent2)'],[/출시|만들어 ?주|있었으면|나왔으면|다시/,'제품 요청','var(--warn)']];
function pickReviews(rv){
  const used=new Set(),out=[];const add=(x,tag,color)=>{if(out.length<4&&!used.has(x)){used.add(x);out.push({x,tag,color})}};
  rv.filter(x=>x.star<=3).sort((a,b)=>a.star-b.star||b.d.localeCompare(a.d)).slice(0,2).forEach(x=>add(x,x.star<=2?'낮은 별점':'개선 신호','var(--bad)'));
  rv.filter(x=>x.imp&&x.star>3).sort((a,b)=>b.d.localeCompare(a.d)).forEach(x=>{const h=PRAISE.find(p=>p[0].test(x.text));add(x,h?h[1]:'CX 중요 표시',h?h[2]:'var(--warn)')});
  rv.filter(x=>x.star>=4).map(x=>{const h=PRAISE.find(p=>p[0].test(x.text));return{x,h,s:(h?2:0)+(x.memo?1:0)+Math.min(1,x.text.length/120)}}).filter(o=>o.h||o.x.memo).sort((a,b)=>b.s-a.s).forEach(o=>add(o.x,o.h?o.h[1]:'CX 메모','var(--accent)'));
  return out;
}

/* 차트: 위 = 출고 막대, 아래 = 사고율(자체 % 눈금) */
function buckets(mode,p){
  const list=[];
  if(mode==='year'){const y=+p.start.slice(0,4);const lastM=y<+LAST.slice(0,4)?11:+LAST.slice(5,7)-1;for(let m=0;m<=lastM;m++){const b=periodOf('month',toS(new Date(y,m,1,12)));list.push({...b,lab:(m+1)+'월',full:y+'년 '+(m+1)+'월'})}}
  else{const n=mode==='week'?10:12;for(let k=n-1;k>=0;k--){const b=shift(mode,p,-k);if(b.end<(FIRST.any||b.end))continue;list.push({...b,lab:mode==='week'?md(b.start):(+b.start.slice(5,7))+'월',full:mode==='week'?mdw(b.start)+' – '+mdw(b.end):b.start.slice(0,4)+'년 '+(+b.start.slice(5,7))+'월',sel:k===0})}}
  return list.map(b=>{const r={start:b.start,end:minS(b.end,LAST)};const m=r.end>=r.start?metrics(r):{out:0,inc:0,incRate:null,miss:0,wrong:0,dmg:0};return{...b,out:m.out,inc:m.inc,miss:m.miss,wrong:m.wrong,dmg:m.dmg,rate:m.incRate,partial:b.end>LAST&&b.start<=LAST}});
}
function chartSVG(bs){
  if(!bs.length||!bs.some(b=>b.out))return'<div class="empty">이 기간에 입력된 출고 기록이 없습니다.</div>';
  const Wd=520,L=40,R=10,BT=24,BB=150,LY=170,RT=196,RB=250,H=262,cw=(Wd-L-R)/bs.length,bw=Math.min(40,cw*.56);
  const maxO=Math.max(1,...bs.map(b=>b.out)),maxRate=Math.max(0,...bs.map(b=>b.rate||0));
  const top=Math.max(.01,Math.ceil(maxRate*1.25/.005)*.005); // 0.5% 단위, 최소 1%
  const y=v=>BB-(BB-BT)*v/maxO,yr=v=>RB-(RB-RT)*v/top;
  let s='<line x1="'+L+'" x2="'+(Wd-R)+'" y1="'+BB+'" y2="'+BB+'" stroke="var(--line)"/>';
  s+='<text x="'+(L-8)+'" y="'+(BT+4)+'" text-anchor="end" font-size="10" fill="var(--sub)">'+fmt(maxO)+'</text><text x="'+(L-8)+'" y="'+(BB)+'" text-anchor="end" font-size="10" fill="var(--sub)">0</text>';
  s+='<line x1="'+L+'" x2="'+(Wd-R)+'" y1="'+RT+'" y2="'+RT+'" stroke="var(--grid)" stroke-dasharray="3 4"/><line x1="'+L+'" x2="'+(Wd-R)+'" y1="'+RB+'" y2="'+RB+'" stroke="var(--line)"/>';
  s+='<text x="'+(L-8)+'" y="'+(RT+4)+'" text-anchor="end" font-size="10" fill="var(--sub)">'+(top*100).toFixed(1)+'%</text><text x="'+(L-8)+'" y="'+(RB+3)+'" text-anchor="end" font-size="10" fill="var(--sub)">0%</text>';
  s+='<text x="'+L+'" y="'+(RT-8)+'" font-size="10.5" font-weight="700" fill="var(--sub)">배송 사고율</text>';
  const pts=[];
  bs.forEach((b,i)=>{const cx=L+cw*i+cw/2,tp=y(b.out);
    s+='<rect x="'+(cx-bw/2)+'" y="'+tp+'" width="'+bw+'" height="'+Math.max(1,BB-tp)+'" rx="4" fill="'+(b.sel?'url(#gsel)':'var(--accent)')+'" opacity="'+(b.sel?1:b.partial?.35:.5)+'"/>';
    if(b.out)s+='<text x="'+cx+'" y="'+(tp-6)+'" text-anchor="middle" font-size="10.5" font-weight="'+(b.sel?800:500)+'" fill="'+(b.sel?'var(--text)':'var(--sub)')+'">'+fmt(b.out)+'</text>';
    s+='<text x="'+cx+'" y="'+LY+'" text-anchor="middle" font-size="10.5" font-weight="'+(b.sel?800:500)+'" fill="'+(b.sel?'var(--text)':'var(--sub)')+'">'+esc(b.lab)+'</text>';
    if(b.rate!=null)pts.push([cx,yr(b.rate),b]);
  });
  if(pts.length>1)s+='<polyline points="'+pts.map(p=>p[0]+','+p[1]).join(' ')+'" fill="none" stroke="var(--bad)" stroke-width="1.8" stroke-linejoin="round"/>';
  pts.forEach(([x,yy,b])=>{s+='<circle cx="'+x+'" cy="'+yy+'" r="'+(b.sel?4.5:3)+'" fill="var(--card)" stroke="var(--bad)" stroke-width="2"/>';if(b.sel)s+='<text x="'+x+'" y="'+(yy-8)+'" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--bad)">'+pct(b.rate)+'</text>'});
  bs.forEach((b,i)=>{s+='<rect class="hit" data-i="'+i+'" x="'+(L+cw*i)+'" y="0" width="'+cw+'" height="'+H+'" fill="transparent"/>'});
  return'<div class="chart"><svg viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="출고와 배송 사고율 추이"><defs><linearGradient id="gsel" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>'+s+'</svg><div class="tip" id="tip"></div></div><div class="legend"><span><i style="background:var(--accent)"></i>출고 건수</span><span><i style="background:var(--bad);height:3px;border-radius:2px;vertical-align:3px"></i>배송 사고율 (아래 칸, 0~'+(top*100).toFixed(1)+'% 눈금)</span></div>';
}
function bindChart(bs){
  const box=document.querySelector('.chart'),tip=$('tip');if(!box||!tip)return;
  const svg=box.querySelector('svg');
  const show=el=>{const b=bs[+el.dataset.i],r=el.getBoundingClientRect(),br=box.getBoundingClientRect();
    tip.innerHTML='<b>'+esc(b.full)+'</b>'+(b.partial?' · 집계 중':'')+'<br>출고 '+fmt(b.out)+'건<br>배송사고 '+fmt(b.inc)+'건 (누락 '+b.miss+' · 오배송 '+b.wrong+' · 파손 '+b.dmg+')<br>출고 대비 사고율 <span class="r">'+(b.rate==null?'—':pct(b.rate))+'</span>';
    let x=r.left-br.left+r.width/2;const half=tip.offsetWidth/2;x=Math.max(half,Math.min(br.width-half,x));
    tip.style.left=x+'px';tip.style.top=(svg.getBoundingClientRect().height*0.30)+'px';tip.style.opacity=1;};
  box.querySelectorAll('.hit').forEach(el=>{el.addEventListener('mouseenter',()=>show(el));el.addEventListener('click',()=>show(el))});
  box.addEventListener('mouseleave',()=>{tip.style.opacity=0});
}

/* ---------- 메인 렌더 ---------- */
function render(){
  if(!D)return;
  const mode=state.mode,p=periodOf(mode,state.anchor);
  const cur={start:p.start,end:minS(p.end,LAST)};
  const prevP=shift(mode,p,-1),prev={start:prevP.start,end:minS(prevP.end,addDays(prevP.start,Math.max(0,diffDays(cur.start,cur.end))))};
  const partial=p.end>LAST;
  const unit=mode==='week'?'주':mode==='month'?'달':'해';
  const prevName=mode==='week'?'전주':mode==='month'?'전월':'전년';

  else if(mode==='month'){$('pLabel').textContent=p.start.slice(0,4)+'년 '+(+p.start.slice(5,7))+'월';$('pSub').textContent=partial?mdw(LAST)+'까지 집계':'월간 합계'}
  else{$('pLabel').textContent=p.start.slice(0,4)+'년 누적';$('pSub').textContent=partial?'1/1 – '+md(LAST)+' 누적':'연간 합계'}

   +kpi('고객 문의·상담',fmt(c.voice),'건',delta(c.voice,cmpVoice?v.voice:null,'count',null),'게시판 문의 '+c.inq+' · 채팅 상담 '+c.chat,'#20b58b')
   +kpi('리뷰 평점',c.avg==null?'—':c.avg.toFixed(2),c.avg==null?'':'/ 5',delta(c.avg,cd('review')?v.avg:null,'avg','high'),'리뷰 '+fmt(c.reviews)+'건 · 3점 이하 '+c.low+'건','#8b7bf0');

  /* 1. 고객 이슈 */
  const tally={},prod={},ex={},ptally={};

  /* 3. 많이 나간 제품 */

  c.orders.forEach(x=>{const k=prodGroup(x.code);inc1(og,k,x.qty);const nm=cleanName(x.name);if(nm)inc1(on[k]=on[k]||{},nm,x.qty);const o=optOf(x.code);if(o)inc1(oo[k]=oo[k]||{},o,x.qty)});
  v.orders.forEach(x=>inc1(po,prodGroup(x.code),x.qty));
  const voiceByProd={};c.voices.forEach(x=>inc1(voiceByProd,pkey(x.product)));
  const otop=topN(og,5),otot=Object.values(og).reduce((a,b)=>a+b,0);
  const sales=otop.length?otop.map(([k,n],i)=>{const name=PRODUCT[k]||(on[k]?topN(on[k],1)[0][0]:k);const opts=oo[k]?topN(oo[k],3).map(a=>a[0]+' '+Math.round(a[1]/n*100)+'%').join(' · '):'';const iss=voiceByProd[pkey(name)]||0;return rk(i,name,n,'개',n/otop[0][1]*100,'전체의 <b>'+Math.round(n/otot*100)+'%</b>'+(opts?' · '+esc(opts):'')+(iss?'<span class="tagx">고객 이슈 '+iss+'건</span>':''),chgTag(n,po[k]||0,cmpOrders,'sales'))}).join(''):'<div class="empty">이 기간 주문 원장 기록이 없습니다.</div>';

  /* 주목할 리뷰 */
  const picks=pickReviews(c.rv);
  const reviewsHtml=picks.length?'<div class="reviews">'+picks.map(({x,tag,color})=>'<div class="rv" style="--c:'+color+'"><div class="rv-h"><span class="rv-tag">'+esc(tag)+'</span><span class="rv-star">'+'★'.repeat(Math.round(x.star))+'<span style="opacity:.25">'+'★'.repeat(Math.max(0,5-Math.round(x.star)))+'</span></span><span class="rv-meta">'+md(x.d)+' · '+esc(x.ch||'')+'</span></div><div class="rv-p">'+esc(x.product)+'</div><div class="rv-t" title="'+esc(x.text)+'">'+esc(x.text)+'</div>'+(x.memo?'<div class="rv-m">CX 메모 · '+esc(x.memo)+'</div>':'')+'</div>').join('')+'</div>':'<div class="empty">이 기간에는 따로 짚어볼 리뷰가 없습니다.</div>';

  /* CX 코멘트 */
  const wk=D.weekly.filter(w=>w.start<=cur.end&&w.end>=cur.start&&(w.note||w.bad)).sort((a,b)=>b.start.localeCompare(a.start))[0];
  const noteHtml=wk?'<div class="note"><span class="tag">주간보고 '+esc(wk.label)+'</span><dl>'+(wk.note?'<dt>해석</dt><dd>'+esc(wk.note)+'</dd>':'')+(wk.bad?'<dt>불만 TOP3</dt><dd>'+esc(wk.bad)+'</dd>':'')+(wk.good?'<dt>칭찬 TOP3</dt><dd>'+esc(wk.good)+'</dd>':'')+'</dl></div>':'<div class="empty">이 기간 주간보고 코멘트가 아직 없습니다.</div>';

  /* SNS 씨딩 */
  const sd=D.seeding,camps={};
  sd.forEach(x=>{(camps[x.camp]=camps[x.camp]||[]).push(x)});
  const lastAct=a=>a.map(x=>x.pd||x.sd||x.cd||'').reduce((m,d)=>d>m?d:m,'');
  const campList=Object.entries(camps).sort((a,b)=>lastAct(b[1]).localeCompare(lastAct(a[1])));
  const overdue=sd.filter(x=>x.sent&&!x.posted&&x.due&&x.due<TODAY);
  let seedHtml='<div class="empty">SNS 씨딩 기록이 없습니다.</div>';
  if(campList.length){
    const [cname,rows]=campList[0];
    const N=rows.length,conf=rows.filter(x=>x.confirmed).length,sent=rows.filter(x=>x.sent).length,posted=rows.filter(x=>x.posted).length;
    const reach=rows.filter(x=>x.posted).reduce((t,x)=>t+x.fol,0),eng=rows.reduce((t,x)=>t+x.likes+x.cmts,0),cost=rows.filter(x=>x.sent).reduce((t,x)=>t+x.cost,0);
    const fs=(l,n,base,extra)=>'<div class="fs"><span>'+l+'</span><b>'+n+'<small>'+(extra||'명')+'</small></b><i style="width:'+(base?n/base*100:0)+'%"></i></div>';
    const newPosts=rows.filter(x=>x.pd&&inR(x.pd,cur)).sort((a,b)=>(b.likes+b.cmts)-(a.likes+a.cmts));
    seedHtml='<div class="camp">'+esc(cname)+'<span>캠페인 누적 · '+(campList.length>1?'외 '+(campList.length-1)+'개 캠페인':'진행 중')+'</span></div>'
      +'<div class="funnel">'+fs('섭외 후보',N,N)+fs('섭외 완료',conf,N)+fs('제품 발송',sent,N)+fs('게시 완료',posted,N,'명 · '+(sent?Math.round(posted/sent*100):0)+'%')+'</div>'
      +'<div class="sdstat"><span>게시 계정 도달<b>'+fmt(reach)+'</b></span><span>좋아요+댓글<b>'+fmt(eng)+'</b></span><span>발송 제품 원가<b>₩'+fmt(cost)+'</b></span>'+(eng&&cost?'<span>반응 1건당<b>₩'+fmt(cost/eng)+'</b></span>':'')+'</div>'
      +(newPosts.length?newPosts.slice(0,4).map(x=>'<div class="post"><span><b>'+esc(x.acc)+'</b><small>팔로워 '+fmt(x.fol)+' · '+md(x.pd)+' 게시</small></span><span class="eng">♥ '+fmt(x.likes)+' · 💬 '+fmt(x.cmts)+'</span>'+(/^https?:\/\//.test(x.url)?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">게시물 ↗</a>':'<span></span>')+'</div>').join(''):'<div class="pd" style="margin:4px 0 0">이 기간 새로 올라온 게시물은 없습니다.</div>')
      +(overdue.length?'<div class="warnline">게시 약속일이 지났는데 아직 미게시 <b>'+overdue.length+'명</b> · '+esc(overdue.slice(0,4).map(x=>x.acc).join(', '))+(overdue.length>4?' 외 '+(overdue.length-4)+'명':'')+'</div>':'');
  }

  /* 한 줄 요약 + 확인 필요 */
  const openInc=D.incidents.filter(x=>!x.done);
  const sents=[];
  if(c.out)sents.push(unit==='주'?'이번 주':'이 기간'+' ');
  let brief='출고 <b>'+fmt(c.out)+'건</b>'+(cd('daily')&&v.out?'('+prevName+' 대비 '+(c.out>=v.out?'▲':'▼')+Math.abs((c.out-v.out)/v.out*100).toFixed(0)+'%)':'')+', 배송 사고율 <b>'+(c.incRate==null?'—':pct(c.incRate))+'</b>.';
  if(tops.length)brief+=' 고객 이슈 1위는 <b>'+esc(tops[0][0])+' '+tops[0][1]+'건</b>('+esc(topN(prod[tops[0][0]],1)[0][0])+').';
  if(rtop.length)brief+=' 재입고 요청은 <b>'+esc(rtop[0][0])+'</b>이(가) 가장 많았습니다.';
  if(otop.length)brief+=' 가장 많이 나간 제품은 <b>'+esc(PRODUCT[otop[0][0]]||otop[0][0])+'</b>.';
  const pills=[];
  if(openInc.length)pills.push('<span class="pill bad">미처리 배송사고 '+openInc.length+'건</span>');
  if(c.low)pills.push('<span class="pill bad">3점 이하 리뷰 '+c.low+'건</span>');
  if(overdue.length)pills.push('<span class="pill warn">씨딩 게시 지연 '+overdue.length+'명</span>');

   +panel('hero','var(--accent)','많이 나간 제품 TOP 5',fmt(otot)+'개','주문 원장 출고 수량 · 옵션 합산',sales)
   +'</div>'
   +'<div class="sec"><h2>고객의 목소리</h2><span>함께 읽어볼 리뷰와 CX팀 해석</span></div>'
   +'<div class="row wide">'+panel('','var(--accent)','이번 '+unit+' 주목할 리뷰',picks.length+'건','낮은 별점, 재구매·구매 동기·B2B 신호 등 다른 팀이 활용할 만한 리뷰를 골랐습니다.',reviewsHtml)
   +panel('','var(--accent)','CX팀 코멘트','주간보고','CX팀이 직접 남긴 해석입니다.',noteHtml)+'</div>'
   +'<div class="sec"><h2>운영 · 마케팅 현황</h2></div>'
   +'<div class="row half">'+panel('','var(--teal)','SNS 씨딩','실제 게시 기준','섭외부터 게시까지 진행 상황과 이 기간 올라온 게시물입니다.',seedHtml)
   +panel('','var(--accent)','출고 · 배송 사고율 추이',mode==='week'?'최근 10주':mode==='month'?'최근 12개월':'월별','막대에 마우스를 올리면 출고 대비 사고율을 볼 수 있습니다.',chartSVG(bs))+'</div>';

/* ---------- 불러오기 / 상태 ---------- */
let loading=false;
async function load(){
  if(loading)return;loading=true;
  $('status').className='status';$('statusText').textContent='불러오는 중';
  let T={},failed=[];
  if(window.CX_TEST_TABLES){for(const s of SOURCES){try{T[s.key]=toTable(window.CX_TEST_TABLES[s.key],s.need)}catch(e){failed.push(s.key)}}}
  else{const res=await Promise.allSettled(SOURCES.map(fetchSource));res.forEach((r,i)=>{if(r.status==='fulfilled')T[SOURCES[i].key]=r.value;else failed.push(SOURCES[i].key)})}
  loading=false;
  if(failed.length===SOURCES.length&&D){$('status').className='status err';$('statusText').textContent='연결 실패 · 이전 데이터 표시';return}
  const firstLoad=!D;build(T);if(firstLoad||!state.anchor)state.anchor=defaultAnchor(state.mode);
  const now=new Date();
  $('status').className='status '+(failed.length?'err':'live');
  $('statusText').textContent=(failed.length?'일부 연결 실패':'실시간')+' · '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+' 갱신';
  const bn=$('banner');
  if(failed.length){bn.style.display='block';bn.innerHTML='<b>다음 탭을 불러오지 못했습니다:</b> '+failed.map(k=>esc(LABEL[k])).join(', ')+'<br>시트 공유가 “링크가 있는 모든 사용자 · 뷰어”인지, 탭 이름과 머리글이 바뀌지 않았는지 확인해 주세요.'}else bn.style.display='none';
  render();
}
document.querySelectorAll('#modeSeg button').forEach(b=>b.addEventListener('click',()=>{if(!D)return;state.mode=b.dataset.mode;state.anchor=defaultAnchor(state.mode);render()}));
$('prevBtn').onclick=()=>{const p=shift(state.mode,periodOf(state.mode,state.anchor),-1);state.anchor=p.start;render()};
$('nextBtn').onclick=()=>{const p=shift(state.mode,periodOf(state.mode,state.anchor),1);state.anchor=minS(p.start,LAST);render()};
$('refreshBtn').onclick=load;
setInterval(()=>{if(!document.hidden)load()},10*60*1000);
window.__fbCXSetTab=function(){window.scrollTo({top:0,behavior:'smooth'})};

/* ---------- 테마 ---------- */
function syncTheme(){const t=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';$('themeLightBtn').classList.toggle('active',t==='light');$('themeDarkBtn').classList.toggle('active',t==='dark');document.querySelector('meta[name="theme-color"]').content=t==='light'?'#f5f6f8':'#12151c'}
function setTheme(v){document.documentElement.setAttribute('data-theme',v);try{localStorage.setItem('theme',v)}catch(e){}syncTheme()}
$('themeLightBtn').onclick=()=>setTheme('light');$('themeDarkBtn').onclick=()=>setTheme('dark');
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});syncTheme();
load();
})();

  /* =========================================================
     URL / 현재 메뉴 확인
     ========================================================= */

  function firstPathSegment(pathname) {

    return (
      pathname
        .split("/")
        .filter(Boolean)[0] || ""
    ).toLowerCase();

  }


  function repoSegmentOf(url) {

    try {

      return firstPathSegment(
        new URL(url).pathname
      );

    }

    catch (e) {

      return "";

    }

  }


  const currentSeg =
    firstPathSegment(location.pathname);


  function detectActive() {

    for (const dept of DEPARTMENTS) {


      /* 같은 대시보드 안의 해시 탭과 개별 페이지를 함께 판별합니다. */
      if (dept.baseUrl && repoSegmentOf(dept.baseUrl) === currentSeg) {
        const hashTab = (location.hash || "").replace("#", "");
        const items = dept.groups ? dept.groups.flatMap(group => group.items) : dept.items;
        const item = items.find(it => it.tab === hashTab) || items.find(it => it.tab === "overview") || items[0];
        return { deptId: dept.id, itemId: item ? item.id : null };
      }
      const items = dept.groups ? dept.groups.flatMap(group => group.items) : dept.items;
      for (const item of items) {
        if (item.url && repoSegmentOf(item.url) === currentSeg) {
          return { deptId: dept.id, itemId: item.id };
        }
      }
    }


    return {

      deptId: null,

      itemId: null

    };

  }


  let active =
    detectActive();


  let openDeptId =
    active.deptId;


  /* =========================================================
     테마
     ========================================================= */

  function getTheme() {

    const htmlTheme =
      document.documentElement
        .getAttribute("data-theme");


    if (
      htmlTheme === "light" ||
      htmlTheme === "dark"
    ) {

      return htmlTheme;

    }


    try {

      const saved =
        localStorage.getItem(THEME_KEY);


      if (
        saved === "light" ||
        saved === "dark"
      ) {

        return saved;

      }

    }

    catch (e) {}


    return "dark";

  }


  function restoreTheme() {

    try {

      let saved =
        localStorage.getItem(THEME_KEY);

      /* 예전 홈에서 사용하던 키가 남아 있으면 공통 키로 한 번만 이전합니다. */
      if (saved !== "light" && saved !== "dark") {

        const legacySaved =
          localStorage.getItem(LEGACY_HOME_THEME_KEY);

        if (
          legacySaved === "light" ||
          legacySaved === "dark"
        ) {

          saved = legacySaved;
          localStorage.setItem(THEME_KEY, saved);

        }

      }

      localStorage.removeItem(LEGACY_HOME_THEME_KEY);


      if (
        saved === "light" ||
        saved === "dark"
      ) {

        document.documentElement
          .setAttribute(
            "data-theme",
            saved
          );

      }

    }

    catch (e) {}

  }


  function saveTheme(theme) {

    if (
      theme !== "light" &&
      theme !== "dark"
    ) {

      return;

    }


    try {

      localStorage.setItem(
        THEME_KEY,
        theme
      );

    }

    catch (e) {}

  }


  function syncSidebarTheme() {

    const sidebar =
      document.getElementById(
        SIDEBAR_ID
      );


    if (!sidebar) return;


    const theme =
      getTheme();


    sidebar.dataset.theme =
      theme;


    if (!THEME_BOOT_LOCKED) {

      saveTheme(theme);

    }


    const logo =
      sidebar.querySelector(
        ".fb-brand-logo"
      );


    if (logo) {

      logo.src =
        theme === "light"
          ? LOGO_BLACK
          : LOGO_WHITE;

    }

  }

    try {

      return (
        localStorage.getItem(
          COLLAPSE_KEY
        ) === "1"

    catch (e) {

    }

  }


  function setCollapsed(value) {

    try {

      localStorage.setItem(
        COLLAPSE_KEY,
        value ? "1" : "0"
      );

    }

    catch (e) {}

  }

  /* =========================================================
     링크
     ========================================================= */

  function itemHref(
    dept,
    item
  ) {

    if (item.tab) {

      const deptSeg =
        repoSegmentOf(
          dept.baseUrl
        );


      if (
        deptSeg === currentSeg
      ) {

        return "#" + item.tab;

      }


      return (
        dept.baseUrl +
        "#" +
        item.tab
      );

    }


    return item.url;

  }



  function onItemClick(
    ev,
    dept,
    item
  ) {

    if (!item.tab) {

      return;

    }


    const deptSeg =
      repoSegmentOf(
        dept.baseUrl
      );


    if (
      deptSeg !== currentSeg
    ) {

      return;

    }


    ev.preventDefault();


    const setTab = dept.id === "cx" ? window.__fbCXSetTab : window.__fbOperationSetTab;
    if (typeof setTab === "function") setTab(item.tab);


    try {

      history.replaceState(
        null,
        "",
        "#" + item.tab
      );

    }

    catch (e) {

      location.hash =
        item.tab;

    }


    active = {

      deptId: dept.id,

      itemId: item.id

    };


    updateActiveHighlight();

  }



  /* =========================================================
     아코디언
     ========================================================= */

  function openExclusively(
    deptId
  ) {

    openDeptId =
      deptId;


    document
      .querySelectorAll(
        `#${SIDEBAR_ID} .fb-dept`
      )
      .forEach(el => {

        el.classList.toggle(
          "open",
          el.dataset.dept === deptId
        );

      });

  }



  /* =========================================================
     렌더링
     ========================================================= */

  function render() {

    const sidebar =
      document.createElement("nav");


    sidebar.id =
      SIDEBAR_ID;


    if (
      isCollapsed()
    ) {

      sidebar.classList
        .add("collapsed");

    }



    /* 상단 */

    const top =
      document.createElement("div");


    top.className =
      "fb-sb-top";


    const initialLogo =
      getTheme() === "light"
        ? LOGO_BLACK
        : LOGO_WHITE;


    top.innerHTML = `

      <a
        class="fb-sb-home"
        href="${HOME_URL}"
        aria-label="FRAME BY 홈"
      >

        <img
          class="fb-brand-logo"
          src="${initialLogo}"
          alt="FRAME BY"
        >

        <span class="label">
          FRAME BY
        </span>

      </a>


      <button
        class="fb-sb-toggle"
        type="button"
        title="사이드바 접기/펼치기"
      >

        ${
          isCollapsed()
            ? "»"
            : "«"
        }

      </button>

    `;



    const toggleBtn =
      top.querySelector(
        ".fb-sb-toggle"
      );


    toggleBtn
      .addEventListener(
        "click",
        () => {

          const collapsed =
            !sidebar.classList
              .contains(
                "collapsed"
              );


          sidebar.classList
            .toggle(
              "collapsed",
              collapsed
            );


          document.body
            .classList
            .toggle(
              "fb-sidebar-collapsed",
              collapsed
            );


          setCollapsed(
            collapsed
          );


          toggleBtn.textContent =
            collapsed
              ? "»"
              : "«";

        }
      );


    sidebar
      .appendChild(top);



    /* 메뉴 */

    const body =
      document.createElement("div");


    body.className =
      "fb-sb-body";



    DEPARTMENTS
      .forEach(
        dept => {


          const wrap =
            document.createElement(
              "div"
            );


          wrap.className =
            "fb-dept" +
            (
              openDeptId ===
              dept.id
                ? " open"
                : ""
            );


          wrap.dataset.dept =
            dept.id;



          /* 부서명 */

          const head =
            document.createElement(
              "button"
            );


          head.type =
            "button";


          head.className =
            "fb-dept-head";


          head.innerHTML = `

            <span
              class="fb-dept-collapsed-mark"
            >

              ${
                dept.name
                  .charAt(0)
                  .toUpperCase()
              }

            </span>


            <span
              class="fb-dept-name"
            >

              ${dept.name}

            </span>


            <span
              class="fb-dept-caret"
            >
              ▸
            </span>

          `;



          head.addEventListener(
            "click",
            () => {


              if (
                sidebar.classList
                  .contains(
                    "collapsed"
                  )
              ) {

                sidebar.classList
                  .remove(
                    "collapsed"
                  );


                document.body
                  .classList
                  .remove(
                    "fb-sidebar-collapsed"
                  );


                setCollapsed(
                  false
                );


                toggleBtn
                  .textContent =
                  "«";

              }


              const willOpen =
                !wrap.classList
                  .contains(
                    "open"
                  );


              openExclusively(
                willOpen
                  ? dept.id
                  : null
              );

            }
          );


          wrap
            .appendChild(head);



          /* 하위 메뉴 */

          const itemsOuter =
            document.createElement(
              "div"
            );


          itemsOuter.className =
            "fb-dept-items";


          const itemsInner =
            document.createElement(
              "div"
            );


          itemsInner.className =
            "fb-dept-items-inner";



          const addItem = (item, target, nested = false) => {
            const a = document.createElement("a");
            a.className = "fb-item" + (nested ? " fb-item-nested" : "");
            a.dataset.dept = dept.id;
            a.dataset.item = item.id;
            a.href = itemHref(dept, item);
            const dot = document.createElement("span");
            dot.className = "fb-item-dot";
            const label = document.createElement("span");
            label.textContent = item.name;
            a.append(dot, label);
            a.addEventListener("click", ev => onItemClick(ev, dept, item));
            target.appendChild(a);
          };
          if (dept.groups) {
            dept.groups.forEach(group => {
              const groupWrap = document.createElement("div");
              groupWrap.className = "fb-menu-group";
              groupWrap.dataset.group = group.id;
              const groupHead = document.createElement("button");
              groupHead.type = "button";
              groupHead.className = "fb-group-head";
              groupHead.textContent = group.name;
              groupHead.setAttribute("aria-expanded", "false");
              groupHead.addEventListener("click", () => {
                const opening = !groupWrap.classList.contains("open");
                itemsInner.querySelectorAll(".fb-menu-group").forEach(el => {
                  el.classList.remove("open");
                  el.querySelector(".fb-group-head")?.setAttribute("aria-expanded", "false");
                });
                groupWrap.classList.toggle("open", opening);
                groupHead.setAttribute("aria-expanded", String(opening));
              });
              const children = document.createElement("div");
              children.className = "fb-group-items";
              group.items.forEach(item => addItem(item, children, true));
              groupWrap.append(groupHead, children);
              itemsInner.appendChild(groupWrap);
            });
          } else {
            dept.items.forEach(item => addItem(item, itemsInner));
          }


          itemsOuter
            .appendChild(
              itemsInner
            );


          wrap
            .appendChild(
              itemsOuter
            );


          body
            .appendChild(
              wrap
            );

        }
      );


    sidebar
      .appendChild(body);


    document.body
      .insertBefore(
        sidebar,
        document.body.firstChild
      );


    syncSidebarTheme();

    updateActiveHighlight();

  }



  /* =========================================================
     현재 메뉴 강조
     ========================================================= */

  function updateActiveHighlight() {

    document.querySelectorAll(`#${SIDEBAR_ID} .fb-menu-group`).forEach(group => {
      if (group.querySelector(`.fb-item[data-item="${active.itemId}"]`)) {
        group.classList.add("open");
        group.querySelector(".fb-group-head")?.setAttribute("aria-expanded", "true");
      }
    });

    document
      .querySelectorAll(
        `#${SIDEBAR_ID} .fb-item`
      )
      .forEach(
        el => {

          el.classList.toggle(

            "active",

            el.dataset.dept ===
              active.deptId &&

            el.dataset.item ===
              active.itemId

          );

        }
      );

  }



  /* =========================================================
     실행
     ========================================================= */

  function boot() {

    if (
      document.getElementById(
        SIDEBAR_ID
      )
    ) {

      return;

    }


    restoreTheme();

    injectStyle();

    render();

    applyBodyOffset();

    syncSidebarTheme();



    /* data-theme 변경 감시 */

    const themeObserver =
      new MutationObserver(
        () => {

          syncSidebarTheme();

        }
      );


    themeObserver.observe(

      document.documentElement,

      {

        attributes:true,

        attributeFilter:[
          "data-theme"
        ]

      }

    );


    /*
     * 일부 대시보드는 로딩 과정에서 data-theme="dark"를 다시 넣습니다.
     * 모든 초기 스크립트가 끝난 뒤 저장된 공통 테마를 한 번 더 적용하고,
     * 그 이후의 변경만 사용자가 선택한 값으로 저장합니다.
     */
    const finishThemeBoot = () => {

      window.setTimeout(
        () => {

          document.documentElement.setAttribute(
            "data-theme",
            INITIAL_SAVED_THEME
          );
          saveTheme(INITIAL_SAVED_THEME);
          THEME_BOOT_LOCKED = false;
          syncSidebarTheme();

        },
        250
      );

    };


    if (document.readyState === "complete") {

      finishThemeBoot();

    } else {

      window.addEventListener(
        "load",
        finishThemeBoot,
        { once:true }
      );

    }



    /* 다른 탭에서 테마 변경 */

    window.addEventListener(
      "storage",
      e => {

        if (
          e.key === THEME_KEY &&
          (
            e.newValue === "light" ||
            e.newValue === "dark"
          )
        ) {

          document.documentElement
            .setAttribute(
              "data-theme",
              e.newValue
            );


          syncSidebarTheme();

        }

      }
    );



    /* 사이드바 삭제 시 복구 */

    const bodyObserver =
      new MutationObserver(
        () => {

          if (
            !document.getElementById(
              SIDEBAR_ID
            )
          ) {

            render();

            applyBodyOffset();

            syncSidebarTheme();

          }

        }
      );


    bodyObserver.observe(

      document.body,

      {
        childList:true
      }

    );



    /* Operation 해시 */

    window.addEventListener(
      "hashchange",
      () => {

        active =
          detectActive();


        if (
          active.deptId
        ) {

          openExclusively(
            active.deptId
          );

        }


        updateActiveHighlight();

      }
    );

  }



  if (
    document.body
  ) {

    boot();

  }

  else {

    document.addEventListener(
      "DOMContentLoaded",
      boot
    );

  }


})();

</script>
</body></html>

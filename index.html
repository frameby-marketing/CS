  :root{

  }
  html[data-theme="light"]{

  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .15s,color .15s;}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;}

  .card.accent-inquiry{border-left:3px solid var(--c-inquiry);}
  .card.accent-chat{border-left:3px solid var(--c-chat);}

  .legend span{display:flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;}

  .badge.inquiry{background:var(--c-inquiry);}
  .badge.chat{background:var(--c-chat);}
  .badge.important{background:var(--bad);}
  .badge.lowrate{background:var(--warn);color:#1a1d23;}
  .badge.stage{background:var(--track);color:var(--sub);}

  .watch-item-meta{font-size:11px;color:var(--sub);margin-top:5px;}
  .empty-state{padding:30px 10px;text-align:center;color:var(--sub);font-size:12.5px;}
  .table-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .table-tabs button{border:1px solid var(--card-border);background:var(--track);color:var(--sub);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;}
  .table-tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .error-banner{background:rgba(255,92,108,.1);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:14px 16px;font-size:12.5px;line-height:1.7;margin-bottom:18px;display:none;}

  footer{color:var(--sub);font-size:12px;text-align:center;margin-top:34px;line-height:1.7;}
  code{background:var(--track);padding:1px 6px;border-radius:4px;font-size:11.5px;}
  @media(max-width:620px){.donut-wrap{width:120px;height:120px;}}

          14px 12px;


        border-bottom:
          1px solid
          var(--sb-border);


        flex-shrink:0;

      }



      .fb-sb-home {

        min-width:0;


        display:flex;

        align-items:center;

        gap:9px;


        color:
          var(--sb-text);


        font-size:14px;

        font-weight:800;

        letter-spacing:.04em;


        text-decoration:none;

        white-space:nowrap;

        overflow:hidden;

      }



      .fb-brand-logo {

        width:22px;

        height:22px;

        object-fit:contain;

        flex:none;

        display:block;

      }



      .fb-sb-home .label {

        overflow:hidden;

        text-overflow:ellipsis;

      }



      #${SIDEBAR_ID}.collapsed
      .fb-sb-home span.label {

        display:none;

      }



      /* ===============================
         접기 버튼
         =============================== */

      .fb-sb-toggle {

        flex-shrink:0;

        width:28px;

        height:28px;


        border-radius:8px;


        border:
          1px solid
          var(--sb-border);


        background:
          var(--sb-control);


        color:
          var(--sb-sub);


        cursor:pointer;


        display:flex;

        align-items:center;

        justify-content:center;


        font-size:13px;

      }



      .fb-sb-toggle:hover {

        background:
          var(--sb-hover);

        color:
          var(--sb-text);

      }



      /* ===============================
         메뉴 영역
         =============================== */

      .fb-sb-body {

        flex:1;

        overflow-y:auto;

        overflow-x:hidden;

        padding:
          10px 8px;

      }



      .fb-sb-body::-webkit-scrollbar {

        width:6px;

      }



      .fb-sb-body::-webkit-scrollbar-thumb {

        background:
          var(--sb-scroll);

        border-radius:3px;

      }



      .fb-dept {

        margin-bottom:4px;

      }



      /* ===============================
         Marketing / Finance / Operation
         =============================== */

      .fb-dept-head {

        display:flex;

        align-items:center;

        gap:10px;


        width:100%;


        padding:
          11px 10px;


        border:none;


        background:
          transparent;


        color:
          var(--sb-sub);


        font-size:13px;

        font-weight:700;

        letter-spacing:.01em;


        border-radius:10px;


        cursor:pointer;

        text-align:left;

        white-space:nowrap;

        overflow:hidden;


        font-family:inherit;

      }



      .fb-dept-head:hover {

        background:
          var(--sb-control);

        color:
          var(--sb-text);

      }



      .fb-dept-name {

        flex:1;

        overflow:hidden;

        text-overflow:ellipsis;

      }



      .fb-dept-caret {

        flex-shrink:0;

        font-size:11px;

        color:
          var(--sb-caret);

        transition:
          transform .18s;

      }



      .fb-dept.open
      .fb-dept-caret {

        transform:
          rotate(90deg);

      }



      .fb-dept.open
      .fb-dept-head {

        background:
          var(--sb-open-bg);

        color:
          var(--sb-text);

      }



      /* 접었을 때 M/F/O */

      .fb-dept-collapsed-mark {

        display:none;

        width:20px;

        text-align:center;

        font-size:12px;

        font-weight:800;

        color:
          var(--sb-sub);

      }



      #${SIDEBAR_ID}.collapsed
      .fb-dept-name,

      #${SIDEBAR_ID}.collapsed
      .fb-dept-caret {

        display:none;

      }



      #${SIDEBAR_ID}.collapsed
      .fb-dept-collapsed-mark {

        display:inline-block;

      }



      #${SIDEBAR_ID}.collapsed
      .fb-dept-head {

        justify-content:center;

        padding:
          11px 0;

      }



      /* ===============================
         하위 메뉴
         =============================== */

      .fb-dept-items {

        display:grid;

        grid-template-rows:0fr;

        transition:
          grid-template-rows
          .18s ease;

      }



      .fb-dept.open
      .fb-dept-items {

        grid-template-rows:1fr;

      }



      .fb-dept-items-inner {

        overflow:hidden;

        padding:
          2px 0 6px;

      }



      #${SIDEBAR_ID}.collapsed
      .fb-dept-items {

        display:none;

      }



      .fb-item {

        display:flex;

        align-items:center;

        gap:9px;


        padding:
          9px 10px 9px 32px;


        border-radius:9px;


        color:
          var(--sb-muted);


        font-size:13px;


        text-decoration:none;

        white-space:nowrap;

        overflow:hidden;

        text-overflow:ellipsis;


        cursor:pointer;


        border:none;

        background:
          transparent;


        width:100%;

        text-align:left;

        font-family:inherit;

      }



      .fb-item:hover {

        background:
          var(--sb-control);

        color:
          var(--sb-text);

      }



      /* 모든 세부 메뉴 앞 점 */

      .fb-item-dot {

        flex-shrink:0;

        width:6px;

        height:6px;

        border-radius:50%;

        background:
          var(--sb-dot);

      }



      .fb-item.active {

        background:
          var(--sb-active-bg);

        color:
          var(--sb-active);

        font-weight:600;

      }



      .fb-item.active
      .fb-item-dot {

        background:
          var(--sb-active-dot);

        box-shadow:
          0 0 8px
          var(--sb-active-dot);

      }



      #${SIDEBAR_ID} .fb-group-head {
        width:100%;border:0;background:transparent;color:var(--sb-sub);
        font-size:13px;font-weight:600;font-family:inherit;text-align:left;padding:10px 12px 10px 29px;
        cursor:pointer;border-radius:9px;
      }
      #${SIDEBAR_ID} .fb-group-head:hover,
      #${SIDEBAR_ID} .fb-menu-group.open > .fb-group-head {background:var(--sb-open-bg);color:var(--sb-active);}
      #${SIDEBAR_ID} .fb-group-head::after {content:"▸";float:right;color:var(--sb-caret);transition:transform .18s;}
      #${SIDEBAR_ID} .fb-menu-group.open > .fb-group-head::after {transform:rotate(90deg);}
      #${SIDEBAR_ID} .fb-group-items {display:none;}
      #${SIDEBAR_ID} .fb-menu-group.open > .fb-group-items {display:block;}
      #${SIDEBAR_ID} .fb-item-nested {padding-left:47px;font-size:12px;}

      /* ===============================
         본문 위치
         =============================== */

      body.fb-has-sidebar {

        margin-left:
          ${WIDTH_OPEN}px;

        transition:
          margin-left .18s ease;

      }



      body.fb-has-sidebar
      .fb-sidebar-collapsed {

        margin-left:
          ${WIDTH_COLLAPSED}px;

      }



      body.fb-has-sidebar.fb-sidebar-collapsed {

        margin-left:
          ${WIDTH_COLLAPSED}px;

      }



      /* ===============================
         모바일
         =============================== */

      @media(max-width:860px) {

        #${SIDEBAR_ID} {

          width:
            ${WIDTH_COLLAPSED}px;

        }


        body.fb-has-sidebar {

          margin-left:
            ${WIDTH_COLLAPSED}px;

        }

      }


    `;


    document.head
      .appendChild(style);

  }



  /* =========================================================
     본문 위치
     ========================================================= */

  function applyBodyOffset() {

    document.body
      .classList
      .add(
        "fb-has-sidebar"
      );


    document.body
      .classList
      .toggle(
        "fb-sidebar-collapsed",
        isCollapsed()
      );

  }



  /* =========================================================
     링크
     ========================================================= */

  function itemHref(
    dept,
    item
  ) {

    if (item.tab) {

      const deptSeg =
        repoSegmentOf(
          dept.baseUrl
        );


      if (
        deptSeg === currentSeg
      ) {

        return "#" + item.tab;

      }


      return (
        dept.baseUrl +
        "#" +
        item.tab
      );

    }


    return item.url;

  }



  function onItemClick(
    ev,
    dept,
    item
  ) {

    if (!item.tab) {

      return;

    }


    const deptSeg =
      repoSegmentOf(
        dept.baseUrl
      );


    if (
      deptSeg !== currentSeg
    ) {

      return;

    }


    ev.preventDefault();


    const setTab = dept.id === "cx" ? window.__fbCXSetTab : window.__fbOperationSetTab;
    if (typeof setTab === "function") setTab(item.tab);


    try {

      history.replaceState(
        null,
        "",
        "#" + item.tab
      );

    }

    catch (e) {

      location.hash =
        item.tab;

    }


    active = {

      deptId: dept.id,

      itemId: item.id

    };


    updateActiveHighlight();

  }



  /* =========================================================
     아코디언
     ========================================================= */

  function openExclusively(
    deptId
  ) {

    openDeptId =
      deptId;


    document
      .querySelectorAll(
        `#${SIDEBAR_ID} .fb-dept`
      )
      .forEach(el => {

        el.classList.toggle(
          "open",
          el.dataset.dept === deptId
        );

      });

  }



  /* =========================================================
     렌더링
     ========================================================= */

  function render() {

    const sidebar =
      document.createElement("nav");


    sidebar.id =
      SIDEBAR_ID;


    if (
      isCollapsed()
    ) {

      sidebar.classList
        .add("collapsed");

    }



    /* 상단 */

    const top =
      document.createElement("div");


    top.className =
      "fb-sb-top";


    const initialLogo =
      getTheme() === "light"
        ? LOGO_BLACK
        : LOGO_WHITE;


    top.innerHTML = `

      <a
        class="fb-sb-home"
        href="${HOME_URL}"
        aria-label="FRAME BY 홈"
      >

        <img
          class="fb-brand-logo"
          src="${initialLogo}"
          alt="FRAME BY"
        >

        <span class="label">
          FRAME BY
        </span>

      </a>


      <button
        class="fb-sb-toggle"
        type="button"
        title="사이드바 접기/펼치기"
      >

        ${
          isCollapsed()
            ? "»"
            : "«"
        }

      </button>

    `;



    const toggleBtn =
      top.querySelector(
        ".fb-sb-toggle"
      );


    toggleBtn
      .addEventListener(
        "click",
        () => {

          const collapsed =
            !sidebar.classList
              .contains(
                "collapsed"
              );


          sidebar.classList
            .toggle(
              "collapsed",
              collapsed
            );


          document.body
            .classList
            .toggle(
              "fb-sidebar-collapsed",
              collapsed
            );


          setCollapsed(
            collapsed
          );


          toggleBtn.textContent =
            collapsed
              ? "»"
              : "«";

        }
      );


    sidebar
      .appendChild(top);



    /* 메뉴 */

    const body =
      document.createElement("div");


    body.className =
      "fb-sb-body";



    DEPARTMENTS
      .forEach(
        dept => {


          const wrap =
            document.createElement(
              "div"
            );


          wrap.className =
            "fb-dept" +
            (
              openDeptId ===
              dept.id
                ? " open"
                : ""
            );


          wrap.dataset.dept =
            dept.id;



          /* 부서명 */

          const head =
            document.createElement(
              "button"
            );


          head.type =
            "button";


          head.className =
            "fb-dept-head";


          head.innerHTML = `

            <span
              class="fb-dept-collapsed-mark"
            >

              ${
                dept.name
                  .charAt(0)
                  .toUpperCase()
              }

            </span>


            <span
              class="fb-dept-name"
            >

              ${dept.name}

            </span>


            <span
              class="fb-dept-caret"
            >
              ▸
            </span>

          `;



          head.addEventListener(
            "click",
            () => {


              if (
                sidebar.classList
                  .contains(
                    "collapsed"
                  )
              ) {

                sidebar.classList
                  .remove(
                    "collapsed"
                  );


                document.body
                  .classList
                  .remove(
                    "fb-sidebar-collapsed"
                  );


                setCollapsed(
                  false
                );


                toggleBtn
                  .textContent =
                  "«";

              }


              const willOpen =
                !wrap.classList
                  .contains(
                    "open"
                  );


              openExclusively(
                willOpen
                  ? dept.id
                  : null
              );

            }
          );


          wrap
            .appendChild(head);



          /* 하위 메뉴 */

          const itemsOuter =
            document.createElement(
              "div"
            );


          itemsOuter.className =
            "fb-dept-items";


          const itemsInner =
            document.createElement(
              "div"
            );


          itemsInner.className =
            "fb-dept-items-inner";



          const addItem = (item, target, nested = false) => {
            const a = document.createElement("a");
            a.className = "fb-item" + (nested ? " fb-item-nested" : "");
            a.dataset.dept = dept.id;
            a.dataset.item = item.id;
            a.href = itemHref(dept, item);
            const dot = document.createElement("span");
            dot.className = "fb-item-dot";
            const label = document.createElement("span");
            label.textContent = item.name;
            a.append(dot, label);
            a.addEventListener("click", ev => onItemClick(ev, dept, item));
            target.appendChild(a);
          };
          if (dept.groups) {
            dept.groups.forEach(group => {
              const groupWrap = document.createElement("div");
              groupWrap.className = "fb-menu-group";
              groupWrap.dataset.group = group.id;
              const groupHead = document.createElement("button");
              groupHead.type = "button";
              groupHead.className = "fb-group-head";
              groupHead.textContent = group.name;
              groupHead.setAttribute("aria-expanded", "false");
              groupHead.addEventListener("click", () => {
                const opening = !groupWrap.classList.contains("open");
                itemsInner.querySelectorAll(".fb-menu-group").forEach(el => {
                  el.classList.remove("open");
                  el.querySelector(".fb-group-head")?.setAttribute("aria-expanded", "false");
                });
                groupWrap.classList.toggle("open", opening);
                groupHead.setAttribute("aria-expanded", String(opening));
              });
              const children = document.createElement("div");
              children.className = "fb-group-items";
              group.items.forEach(item => addItem(item, children, true));
              groupWrap.append(groupHead, children);
              itemsInner.appendChild(groupWrap);
            });
          } else {
            dept.items.forEach(item => addItem(item, itemsInner));
          }


          itemsOuter
            .appendChild(
              itemsInner
            );


          wrap
            .appendChild(
              itemsOuter
            );


          body
            .appendChild(
              wrap
            );

        }
      );


    sidebar
      .appendChild(body);


    document.body
      .insertBefore(
        sidebar,
        document.body.firstChild
      );


    syncSidebarTheme();

    updateActiveHighlight();

  }



  /* =========================================================
     현재 메뉴 강조
     ========================================================= */

  function updateActiveHighlight() {

    document.querySelectorAll(`#${SIDEBAR_ID} .fb-menu-group`).forEach(group => {
      if (group.querySelector(`.fb-item[data-item="${active.itemId}"]`)) {
        group.classList.add("open");
        group.querySelector(".fb-group-head")?.setAttribute("aria-expanded", "true");
      }
    });

    document
      .querySelectorAll(
        `#${SIDEBAR_ID} .fb-item`
      )
      .forEach(
        el => {

          el.classList.toggle(

            "active",

            el.dataset.dept ===
              active.deptId &&

            el.dataset.item ===
              active.itemId

          );

        }
      );

  }



  /* =========================================================
     실행
     ========================================================= */

  function boot() {

    if (
      document.getElementById(
        SIDEBAR_ID
      )
    ) {

      return;

    }


    restoreTheme();

    injectStyle();

    render();

    applyBodyOffset();

    syncSidebarTheme();



    /* data-theme 변경 감시 */

    const themeObserver =
      new MutationObserver(
        () => {

          syncSidebarTheme();

        }
      );


    themeObserver.observe(

      document.documentElement,

      {

        attributes:true,

        attributeFilter:[
          "data-theme"
        ]

      }

    );


    /*
     * 일부 대시보드는 로딩 과정에서 data-theme="dark"를 다시 넣습니다.
     * 모든 초기 스크립트가 끝난 뒤 저장된 공통 테마를 한 번 더 적용하고,
     * 그 이후의 변경만 사용자가 선택한 값으로 저장합니다.
     */
    const finishThemeBoot = () => {

      window.setTimeout(
        () => {

          document.documentElement.setAttribute(
            "data-theme",
            INITIAL_SAVED_THEME
          );
          saveTheme(INITIAL_SAVED_THEME);
          THEME_BOOT_LOCKED = false;
          syncSidebarTheme();

        },
        250
      );

    };


    if (document.readyState === "complete") {

      finishThemeBoot();

    } else {

      window.addEventListener(
        "load",
        finishThemeBoot,
        { once:true }
      );

    }



    /* 다른 탭에서 테마 변경 */

    window.addEventListener(
      "storage",
      e => {

        if (
          e.key === THEME_KEY &&
          (
            e.newValue === "light" ||
            e.newValue === "dark"
          )
        ) {

          document.documentElement
            .setAttribute(
              "data-theme",
              e.newValue
            );


          syncSidebarTheme();

        }

      }
    );



    /* 사이드바 삭제 시 복구 */

    const bodyObserver =
      new MutationObserver(
        () => {

          if (
            !document.getElementById(
              SIDEBAR_ID
            )
          ) {

            render();

            applyBodyOffset();

            syncSidebarTheme();

          }

        }
      );


    bodyObserver.observe(

      document.body,

      {
        childList:true
      }

    );



    /* Operation 해시 */

    window.addEventListener(
      "hashchange",
      () => {

        active =
          detectActive();


        if (
          active.deptId
        ) {

          openExclusively(
            active.deptId
          );

        }


        updateActiveHighlight();

      }
    );

  }



  if (
    document.body
  ) {

    boot();

  }

  else {

    document.addEventListener(
      "DOMContentLoaded",
      boot
    );

  }


})();

</script></body></html>

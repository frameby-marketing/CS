<!doctype html><html lang="ko" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CX 대시보드</title><meta name="theme-color" content="#12151c">
<script>(function(){try{var v=localStorage.getItem("theme");if(v!=="light"&&v!=="dark")v=localStorage.getItem("fb-hub-theme");document.documentElement.setAttribute("data-theme",v==="light"?"light":"dark")}catch(e){}})();</script>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--text:#e8eaed;--sub:#9aa1ac;--accent:#4c8dff;--accent2:#8b7bf0;--good:#3ecf8e;--bad:#ff5c6c;--warn:#ffb648;--track:#262b36;--grid:#242832;--soft:rgba(76,141,255,.10)}
html[data-theme="light"]{--bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--text:#1a1d23;--sub:#6b7280;--accent:#2a78d6;--accent2:#7059c9;--good:#0a8a3f;--bad:#d93a3a;--warn:#c07a00;--track:#eceef1;--grid:#eceef1;--soft:rgba(42,120,214,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,"Apple SD Gothic Neo",Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .15s,color .15s}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 56px}
button{font-family:inherit}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--sub);font-size:12.5px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px;font-weight:600}
.status i{width:8px;height:8px;border-radius:50%;background:var(--sub)}
.status.live i{background:var(--good);box-shadow:0 0 0 3px rgba(62,207,142,.18)}
.status.err i{background:var(--bad)}
.seg{display:inline-flex;background:var(--track);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--sub);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.seg.theme button{padding:6px 10px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pnav{display:flex;align-items:center;gap:8px}
.pnav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px;cursor:pointer}
.pnav button:disabled{opacity:.3;cursor:default}
.plabel{text-align:center;min-width:190px}
.plabel b{display:block;font-size:15px}
.plabel small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.banner{display:none;border:1px solid var(--bad);background:rgba(255,92,108,.08);color:var(--bad);border-radius:12px;padding:12px 15px;font-size:12.5px;line-height:1.6;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;min-width:0;border-top:3px solid var(--c,var(--accent))}
.k-l{font-size:12.5px;color:var(--sub);font-weight:650}
.k-v{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:8px 0 4px;line-height:1.2}
.k-v em{font-style:normal;font-size:13px;color:var(--sub);font-weight:600;margin-left:3px}
.k-d{font-size:12px;font-weight:700;color:var(--sub);min-height:17px}
.k-d.good{color:var(--good)}.k-d.bad{color:var(--bad)}
.k-d span{font-weight:500;color:var(--sub);margin-left:3px}
.k-s{font-size:11.5px;color:var(--sub);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:grid;gap:14px;margin-top:14px}
.row.a{grid-template-columns:1.35fr 1fr}
.row.b{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.ph h2{font-size:14px;margin:0}
.ph span{font-size:11px;color:var(--sub);white-space:nowrap}
.pd{font-size:11.5px;color:var(--sub);margin:0 0 12px}
.empty{color:var(--sub);font-size:12.5px;padding:22px 4px;text-align:center}
.chart svg{display:block;width:100%;height:auto}
.chart .bar{cursor:pointer}
.legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.issue{padding:11px 0;border-top:1px solid var(--line)}
.issue:first-of-type{border-top:0;padding-top:4px}
.i-top{display:flex;align-items:center;gap:9px}
.i-rank{width:20px;height:20px;border-radius:6px;background:var(--track);color:var(--sub);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.issue:first-of-type .i-rank{background:var(--bad);color:#fff}
.i-top b{font-size:13.5px;flex:1}
.i-n{font-size:13px;font-weight:800}
.i-n small{color:var(--sub);font-weight:600;margin-left:4px;font-size:11px}
.trk{height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin:8px 0 6px 29px}
.trk i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.issue:first-of-type .trk i{background:var(--bad)}
.i-sub{font-size:11.5px;color:var(--sub);margin-left:29px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-sub b{color:var(--text);font-weight:650}
.li{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px}
.li:first-of-type{border-top:0}
.li .no{color:var(--sub);font-weight:800;font-size:11px}
.li .nm{min-width:0}
.li .nm b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .nm small{display:block;color:var(--sub);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font-weight:800}
.li .v small{color:var(--sub);font-weight:600;font-size:10.5px;margin-left:3px}
.note{font-size:12.5px;line-height:1.65}
.note .tag{display:inline-block;font-size:10.5px;color:var(--sub);background:var(--track);border-radius:99px;padding:3px 9px;margin-bottom:8px}
.note dl{margin:0}
.note dt{font-size:11px;color:var(--sub);font-weight:700;margin-top:9px}
.note dd{margin:3px 0 0}
.alert{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:12px}
.alert.bad{background:rgba(255,92,108,.10);color:var(--bad)}
.alert b{font-size:14px;white-space:nowrap}
.foot{margin-top:26px;color:var(--sub);font-size:11px;line-height:1.75;text-align:center}
.foot a{color:var(--accent);text-decoration:none}
.skel{height:120px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--track),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.row.b{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.row.a,.row.b{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{justify-content:center}.k-v{font-size:24px}}
@media(max-width:420px){.wrap{padding:18px 14px 40px}.plabel{min-width:150px}}
</style></head><body><div class="wrap">
<header class="top"><div><h1>CX 대시보드</h1><div class="sub">고객 반응과 배송 품질 요약 · 전사 공유용</div></div>
<div class="actions"><span class="status" id="status"><i></i><span id="statusText">불러오는 중</span></span><button type="button" class="btn" id="refreshBtn">↻ 새로고침</button><div class="seg theme"><button type="button" id="themeLightBtn" title="라이트 모드">☀️</button><button type="button" id="themeDarkBtn" title="다크 모드">🌙</button></div></div></header>
<div class="controls"><div class="seg" id="modeSeg"><button type="button" data-mode="week">주간</button><button type="button" data-mode="month">월간</button><button type="button" data-mode="year">연간 누적</button></div>
<div class="pnav"><button type="button" id="prevBtn" aria-label="이전 기간">‹</button><div class="plabel"><b id="pLabel">—</b><small id="pSub"></small></div><button type="button" id="nextBtn" aria-label="다음 기간">›</button></div></div>
<div class="banner" id="banner"></div>
<div id="app"><div class="kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
<div class="foot">출고·반품·교환·사고: [CX팀] 배송 › 일자별 · 고객 목소리: [CX팀] 고객 › 고객문의·채팅상담·리뷰 · 판매 수량: [CX팀] 출고원장 › 주문 원장<br>배송 사고율 = (누락+오배송+분실/파손) ÷ 출고 · 비교는 직전 기간의 같은 일수 기준 · 10분마다 자동 갱신<br><a href="https://docs.google.com/spreadsheets/d/1XA6e37oPd0ER8W4o-HM5OIkoETvh3xhugESKKOmWlf8/edit" target="_blank" rel="noopener">고객 시트 ↗</a> · <a href="https://docs.google.com/spreadsheets/d/1sRKkaT6xPqsuZ_9fVupcwP-bGWTai4VITCgJNJucTxM/edit" target="_blank" rel="noopener">배송 시트 ↗</a> · <a href="https://docs.google.com/spreadsheets/d/1LRc3ip_ak_zuba6RnvQO6U1TkCZV3ctTnFWFPoknPEs/edit" target="_blank" rel="noopener">출고원장 시트 ↗</a></div>
</div>
<script>
(function(){
const IDS={고객:'1XA6e37oPd0ER8W4o-HM5OIkoETvh3xhugESKKOmWlf8',배송:'1sRKkaT6xPqsuZ_9fVupcwP-bGWTai4VITCgJNJucTxM',출고원장:'1LRc3ip_ak_zuba6RnvQO6U1TkCZV3ctTnFWFPoknPEs'};
const SOURCES=[
 {key:'daily',book:'배송',sheets:['일자별'],need:['날짜','출고 합계']},
 {key:'incidents',book:'배송',sheets:['배송사고','클레임'],need:['접수일','구분']},
 {key:'orders',book:'출고원장',sheets:['주문 원장'],need:['출고일자','상품코드']},
 {key:'inquiry',book:'고객',sheets:['고객문의'],need:['문의일','문의 내용']},
 {key:'review',book:'고객',sheets:['리뷰'],need:['리뷰 작성일','별점']},
 {key:'chat',book:'고객',sheets:['채팅상담'],need:['인입일','상담 내용 요약']},
 {key:'weekly',book:'고객',sheets:['주간보고'],need:['구분','기간']}
];
const LABEL={daily:'배송 › 일자별',incidents:'배송 › 배송사고',orders:'출고원장 › 주문 원장',inquiry:'고객 › 고객문의',review:'고객 › 리뷰',chat:'고객 › 채팅상담',weekly:'고객 › 주간보고'};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('ko-KR').format(Math.round(n||0));
const pct=(n,d=2)=>(n*100).toFixed(d)+'%';
const norm=s=>String(s??'').replace(/\s+/g,' ').trim();
const num=v=>{const n=parseFloat(String(v??'').replace(/[,%\s원건점개]/g,''));return isFinite(n)?n:0};

/* ---------- 시트 불러오기 ---------- */
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function locate(h,key){key=norm(key);let i=h.indexOf(key);if(i<0)i=h.findIndex(x=>x.endsWith(key));if(i<0)i=h.findIndex(x=>x.includes(key));return i}
function toTable(rows,need){for(let r=0;r<Math.min(rows.length,8);r++){const h=rows[r].map(norm);if(need.every(k=>locate(h,k)>=0))return{h,rows:rows.slice(r+1),idx:{}}}throw new Error('머리글 없음')}
function jsonp(url){return new Promise((res,rej)=>{const cb='__gv'+Math.random().toString(36).slice(2);const s=document.createElement('script');const tm=setTimeout(()=>{done();rej(new Error('timeout'))},20000);function done(){clearTimeout(tm);try{delete window[cb]}catch(e){}s.remove()}window[cb]=d=>{done();if(!d||d.status==='error'||!d.table)rej(new Error('gviz'));else res(d.table)};s.onerror=()=>{done();rej(new Error('load'))};s.src=url.replace('tqx=out:csv','tqx=responseHandler:'+cb);document.head.appendChild(s)})}
function tableFromJson(t){const head=t.cols.map(c=>c.label||'');return[head,...t.rows.map(r=>(r.c||[]).map(c=>c?(c.f!=null?c.f:(c.v==null?'':String(c.v))):''))]}
async function fetchSource(s){
  const variants=[];
  for(const sh of s.sheets){const base='https://docs.google.com/spreadsheets/d/'+IDS[s.book]+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(sh);variants.push(base,base+'&headers=1&range=A2:AZ')}
  for(const u of variants){try{const r=await fetch(u+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const txt=await r.text();if(/^\s*</.test(txt))throw 0;return toTable(parseCSV(txt),s.need)}catch(e){}}
  for(const u of variants){try{return toTable(tableFromJson(await jsonp(u)),s.need)}catch(e){}}
  throw new Error(s.key);
}
const get=(t,r,k)=>{let i=t.idx[k];if(i===undefined)i=t.idx[k]=locate(t.h,k);return i>=0?norm(r[i]):''};
const mapRows=(t,fn)=>t?t.rows.map(r=>fn(k=>get(t,r,k))).filter(Boolean):[];
function pdate(v){const m=String(v||'').match(/(\d{2,4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);if(!m)return null;let y=+m[1];if(y<100)y+=2000;const mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return null;return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}

/* ---------- 데이터 정리 ---------- */
let D=null,LAST=null,FIRST={},state={mode:'week',anchor:null};
function build(T){
  const daily=mapRows(T.daily,g=>{const d=pdate(g('날짜'));if(!d)return null;const own=num(g('자사몰 출고')),cp=num(g('쿠팡 출고')),out=num(g('출고 합계'))||own+cp,miss=num(g('누락')),wrong=num(g('오배송')),dmg=num(g('파손'));return{d,out,own,cp,miss,wrong,dmg,inc:Math.max(miss+wrong+dmg,num(g('사고 합계'))),ret:num(g('반품')),exch:num(g('교환'))}});
  const incidents=mapRows(T.incidents,g=>{const d=pdate(g('접수일'));if(!d)return null;return{d,type:g('구분'),product:g('주문 제품'),platform:g('플랫폼'),done:!!pdate(g('처리 완료일'))}});
  const orders=mapRows(T.orders,g=>{const d=pdate(g('출고일자'));const code=g('상품코드');if(!d||!code)return null;return{d,code,name:g('주문 내역'),qty:num(g('수량'))||1}});
  const inquiry=mapRows(T.inquiry,g=>{const d=pdate(g('문의일'));const text=g('문의 내용');if(!d||!text)return null;return{d,src:'문의',product:g('제품'),opt:g('기종·옵션'),text}});
  const chat=mapRows(T.chat,g=>{const d=pdate(g('인입일'));const text=g('상담 내용 요약');if(!d||!text)return null;return{d,src:'채팅',product:g('제품'),opt:g('기종·옵션'),text}});
  const review=mapRows(T.review,g=>{const d=pdate(g('리뷰 작성일'));const star=num(g('별점'));if(!d||!star)return null;return{d,src:'리뷰',product:g('제품'),opt:g('기종·옵션'),star,text:g('리뷰 내용')}});
  const weekly=mapRows(T.weekly,g=>{const m=g('기간').match(/(\d{2,4})\.(\d{1,2})\.(\d{1,2})\s*[-~]\s*(?:(\d{2,4})\.)?(\d{1,2})\.(\d{1,2})/);if(!m)return null;const y=+m[1]<100?2000+ +m[1]:+m[1];const p=(a,b,c)=>a+'-'+String(b).padStart(2,'0')+'-'+String(c).padStart(2,'0');return{start:p(y,m[2],m[3]),end:p(m[4]?(+m[4]<100?2000+ +m[4]:+m[4]):y,m[5],m[6]),label:g('기간'),bad:g('불만 TOP3'),good:g('칭찬 TOP3'),restock:g('재입고 수요 TOP'),note:g('이상 / 해석')}});
  D={daily,incidents,orders,inquiry,chat,review,weekly};
  const shipDays=daily.filter(r=>r.out>0).map(r=>r.d);
  FIRST={daily:shipDays.length?shipDays.reduce((a,b)=>a<b?a:b):null};
  ['inquiry','chat','review','orders','incidents'].forEach(k=>{const ds=D[k].map(r=>r.d);FIRST[k]=ds.length?ds.reduce((a,b)=>a<b?a:b):null});
  const today=toS(new Date());
  const all=[...shipDays,...inquiry.map(r=>r.d),...chat.map(r=>r.d),...review.map(r=>r.d)].filter(d=>d<=today);
  LAST=all.length?all.reduce((a,b)=>a>b?a:b):today;
  FIRST.any=[FIRST.daily,FIRST.inquiry,FIRST.orders].filter(Boolean).sort()[0]||LAST;
}

/* ---------- 기간 ---------- */
const toD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const toS=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const addDays=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return toS(d)};
const diffDays=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const minS=(a,b)=>a<b?a:b;
function periodOf(mode,s){const d=toD(s);if(mode==='week'){const st=addDays(s,-((d.getDay()+6)%7));return{start:st,end:addDays(st,6)}}if(mode==='month')return{start:toS(new Date(d.getFullYear(),d.getMonth(),1,12)),end:toS(new Date(d.getFullYear(),d.getMonth()+1,0,12))};return{start:d.getFullYear()+'-01-01',end:d.getFullYear()+'-12-31'}}
function shift(mode,p,k){const d=toD(p.start);if(mode==='week')return periodOf(mode,addDays(p.start,7*k));if(mode==='month')return periodOf(mode,toS(new Date(d.getFullYear(),d.getMonth()+k,1,12)));return periodOf(mode,toS(new Date(d.getFullYear()+k,0,1,12)))}
const W='일월화수목금토';
const md=s=>{const d=toD(s);return(d.getMonth()+1)+'/'+d.getDate()};
const mdw=s=>md(s)+'('+W[toD(s).getDay()]+')';
const inR=(d,r)=>d>=r.start&&d<=r.end;

/* ---------- 집계 ---------- */
function metrics(r){
  const dl=D.daily.filter(x=>inR(x.d,r)),s=k=>dl.reduce((t,x)=>t+x[k],0);
  const out=s('out'),inc=s('inc'),ret=s('ret'),exch=s('exch');
  const inq=D.inquiry.filter(x=>inR(x.d,r)),ch=D.chat.filter(x=>inR(x.d,r)),rv=D.review.filter(x=>inR(x.d,r));
  return{out,own:s('own'),cp:s('cp'),inc,miss:s('miss'),wrong:s('wrong'),dmg:s('dmg'),ret,exch,
    incRate:out?inc/out:null,reRate:out?(ret+exch)/out:null,inq:inq.length,chat:ch.length,voice:inq.length+ch.length,
    reviews:rv.length,avg:rv.length?rv.reduce((t,x)=>t+x.star,0)/rv.length:null,low:rv.filter(x=>x.star<=3).length,
    voices:[...inq,...ch,...rv.filter(x=>x.star<=3)],asks:[...inq,...ch]};
}
const covered=(k,r)=>FIRST[k]&&FIRST[k]<=r.start;

const TOPICS=[
 {n:'힌지·크랙',re:/힌지|크랙|금이|금 간|금간|금가/},
 {n:'자석 분리·불량',re:/자석/},
 {n:'파손·내구성',re:/파손|깨[지졌짐]|찢어|불량|고장|헐거|충격|보호/},
 {n:'마감·포장',re:/마감|찌그러|흠집|스크래치|기스|포장|변색|들뜸|유격/},
 {n:'배송',re:/배송 ?지연|누락|오배송|택배|도착|안 ?와/},
 {n:'가격·할인',re:/가격|할인|비싸|금액|쿠폰/},
 {n:'재입고·품절',re:/재입고|입고|품절|단종|언제 들어|출시/},
 {n:'호환·사용법',re:/호환|거치|가능할까|가능한가|사이즈|인치|무게|닫히지|방법|사용 가능/}
];
const RESTOCK=/재입고|입고|품절|단종|언제 들어|출시/;
function topicOf(text){for(const t of TOPICS)if(t.re.test(text))return t.n;return'기타'}
const topN=(map,n)=>Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n);
function models(x){const tags=[];const re=/(?:아이폰|iphone)\s*(\d{2})\s*(프로\s*맥스|프로맥스|pro\s*max|프로|pro|미니|mini|플러스|plus|에어|air)?/gi;let m;const src=x.opt+' '+x.text;while((m=re.exec(src)))tags.push('아이폰 '+m[1]+(m[2]?' '+m[2].replace(/\s+/g,'').replace(/promax/i,'프로맥스').replace(/^pro$/i,'프로').replace(/^mini$/i,'미니').replace(/^plus$/i,'플러스').replace(/^air$/i,'에어'):''));if(!tags.length&&x.opt&&x.opt!=='—'&&x.opt.length<=18)tags.push(x.opt);return tags}
function cleanName(s){return String(s).replace(/^프레임바이\s*/,'').split(/\s*(?:기종\s*[:=]|[=\/:(\[])\s*/)[0].trim()}

/* ---------- 렌더 ---------- */
function delta(cur,prev,kind,good){
  if(cur==null||prev==null)return'<div class="k-d">&nbsp;</div>';
  let v,txt;
  if(kind==='count'){if(!prev)return'<div class="k-d">&nbsp;</div>';v=(cur-prev)/prev;txt=(v>=0?'▲ ':'▼ ')+Math.abs(v*100).toFixed(0)+'%'}
  else if(kind==='rate'){v=cur-prev;txt=(v>=0?'▲ ':'▼ ')+Math.abs(v*100).toFixed(2)+'%p'}
  else{v=cur-prev;txt=(v>=0?'▲ ':'▼ ')+Math.abs(v).toFixed(2)+'점'}
  if(Math.abs(v)<1e-9)txt='– 변동 없음';
  const cls=Math.abs(v)<1e-9||!good?'':((good==='low')===(v<0)?'good':'bad');
  return'<div class="k-d '+cls+'">'+txt+'<span>'+CMP+'</span></div>';
}
let CMP='';
function kpi(label,value,unit,d,subline,color){return'<div class="kpi" style="--c:'+color+'"><div class="k-l">'+esc(label)+'</div><div class="k-v">'+esc(value)+'<em>'+esc(unit)+'</em></div>'+d+'<div class="k-s" title="'+esc(subline)+'">'+esc(subline)+'</div></div>'}

function buckets(mode,p){
  const list=[];
  if(mode==='year'){const y=+p.start.slice(0,4);const lastM=y<+LAST.slice(0,4)?11:+LAST.slice(5,7)-1;for(let m=0;m<=lastM;m++){const b=periodOf('month',toS(new Date(y,m,1,12)));list.push({...b,lab:(m+1)+'월',go:['month',b.start]})}}
  else{const n=mode==='week'?10:12;for(let k=n-1;k>=0;k--){const b=shift(mode,p,-k);if(b.end<(FIRST.any||b.end))continue;list.push({...b,lab:mode==='week'?md(b.start):(+b.start.slice(5,7))+'월',go:[mode,b.start],sel:k===0})}}
  return list.map(b=>{const r={start:b.start,end:minS(b.end,LAST)};const m=r.end>=r.start?metrics(r):{out:0,inc:0,incRate:null};return{...b,out:m.out,inc:m.inc,rate:m.incRate,partial:b.end>LAST&&b.start<=LAST}});
}
function chartSVG(bs){
  if(!bs.length||!bs.some(b=>b.out))return'<div class="empty">이 기간에 입력된 출고 기록이 없습니다.</div>';
  const Wd=640,H=230,L=8,R=8,T=26,B=34,cw=(Wd-L-R)/bs.length,bw=Math.min(42,cw*.58);
  const maxO=Math.max(1,...bs.map(b=>b.out)),maxR=Math.max(.001,...bs.map(b=>b.rate||0))*1.3;
  const y=v=>T+(H-T-B)*(1-v/maxO),yr=v=>T+(H-T-B)*(1-v/maxR);
  let g='';for(let i=0;i<=3;i++){const yy=T+(H-T-B)*i/3;g+='<line x1="'+L+'" x2="'+(Wd-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--grid)" stroke-width="1"/>'}
  let bars='',pts=[],labs='';
  bs.forEach((b,i)=>{const cx=L+cw*i+cw/2,top=y(b.out),hl=b.sel||state.mode==='year'&&false;
    const fill=b.sel?'url(#gsel)':'var(--accent)',op=b.sel?1:(b.partial?.35:.55);
    bars+='<g class="bar" data-go="'+b.go.join('|')+'"><title>'+esc((b.lab)+' · 출고 '+fmt(b.out)+'건 · 사고 '+fmt(b.inc)+'건'+(b.rate!=null?' ('+pct(b.rate)+')':'')+(b.partial?' · 집계 중':''))+'</title><rect x="'+(L+cw*i)+'" y="'+T+'" width="'+cw+'" height="'+(H-T-B)+'" fill="transparent"/><rect x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+Math.max(1,H-B-top)+'" rx="4" fill="'+fill+'" opacity="'+op+'"/>'+(b.out?'<text x="'+cx+'" y="'+(top-6)+'" text-anchor="middle" font-size="10.5" font-weight="'+(b.sel?800:500)+'" fill="'+(b.sel?'var(--text)':'var(--sub)')+'">'+fmt(b.out)+'</text>':'')+'</g>';
    labs+='<text x="'+cx+'" y="'+(H-B+16)+'" text-anchor="middle" font-size="10.5" font-weight="'+(b.sel?800:500)+'" fill="'+(b.sel?'var(--text)':'var(--sub)')+'">'+esc(b.lab)+'</text>';
    if(b.rate!=null)pts.push([cx,yr(b.rate),b]);
  });
  const line=pts.length>1?'<polyline points="'+pts.map(p=>p[0]+','+p[1]).join(' ')+'" fill="none" stroke="var(--bad)" stroke-width="2" stroke-linejoin="round" opacity=".9"/>':'';
  const dots=pts.map(([x,yy,b])=>'<circle cx="'+x+'" cy="'+yy+'" r="'+(b.sel?4.5:3)+'" fill="var(--card)" stroke="var(--bad)" stroke-width="2"/>'+(b.sel?'<text x="'+x+'" y="'+(Math.abs(yy-y(b.out))<26?yy+17:yy-9)+'" text-anchor="middle" font-size="11" font-weight="800" fill="var(--bad)">'+pct(b.rate)+'</text>':'')).join('');
  return'<svg viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="출고와 배송 사고율 추이"><defs><linearGradient id="gsel" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>'+g+bars+line+dots+labs+'</svg><div class="legend"><span><i style="background:var(--accent)"></i>출고 건수</span><span><i style="background:var(--bad);height:3px;border-radius:2px;vertical-align:3px"></i>배송 사고율</span><span>막대를 누르면 해당 기간으로 이동</span></div>';
}

function render(){
  if(!D)return;
  const mode=state.mode,p=periodOf(mode,state.anchor);
  const cur={start:p.start,end:minS(p.end,LAST)};
  const prevP=shift(mode,p,-1),prev={start:prevP.start,end:minS(prevP.end,addDays(prevP.start,Math.max(0,diffDays(cur.start,cur.end))))};
  const partial=p.end>LAST;
  CMP=' '+(mode==='week'?'전주':mode==='month'?'전월':'전년')+(partial?' 동기간':'')+' 대비';
  // 라벨
  if(mode==='week'){$('pLabel').textContent=mdw(p.start)+' – '+mdw(p.end);$('pSub').textContent=partial?(p.start<=LAST?mdw(LAST)+'까지 집계 · 이번 주':'집계 전'):p.start.slice(0,4)+'년'}
  else if(mode==='month'){$('pLabel').textContent=p.start.slice(0,4)+'년 '+(+p.start.slice(5,7))+'월';$('pSub').textContent=partial?mdw(LAST)+'까지 집계':'월간 합계'}
  else{$('pLabel').textContent=p.start.slice(0,4)+'년 누적';$('pSub').textContent=partial?'1/1 – '+md(LAST)+' 누적':'연간 합계'}
  $('nextBtn').disabled=shift(mode,p,1).start>LAST;
  $('prevBtn').disabled=shift(mode,p,-1).end<(FIRST.any||'0');
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));

  const c=metrics(cur),v=metrics(prev);
  const cd=k=>covered(k,prev);
  const tiles=kpi('출고',fmt(c.out),'건',delta(c.out,cd('daily')?v.out:null,'count',null),'자사몰 '+fmt(c.own)+' · 쿠팡 '+fmt(c.cp),'#4c8dff')
   +kpi('배송 사고율',c.incRate==null?'—':pct(c.incRate),'',delta(c.incRate,cd('daily')?v.incRate:null,'rate','low'),'사고 '+fmt(c.inc)+'건 · 누락 '+c.miss+' · 오배송 '+c.wrong+' · 파손 '+c.dmg,'#ff5c6c')
   +kpi('반품·교환율',c.reRate==null?'—':pct(c.reRate),'',delta(c.reRate,cd('daily')?v.reRate:null,'rate','low'),'반품 '+fmt(c.ret)+'건 · 교환 '+fmt(c.exch)+'건','#ffb648')
   +kpi('고객 문의·상담',fmt(c.voice),'건',delta(c.voice,cd('inquiry')?v.voice:null,'count',null),'게시판 문의 '+c.inq+' · 채팅 상담 '+c.chat,'#20b58b')
   +kpi('리뷰 평점',c.avg==null?'—':c.avg.toFixed(2),c.avg==null?'':'/ 5',delta(c.avg,cd('review')?v.avg:null,'avg','high'),'리뷰 '+fmt(c.reviews)+'건 · 3점 이하 '+c.low+'건','#8b7bf0');

  // 이슈
  const tally={},prod={},ex={};
  c.voices.forEach(x=>{const t=topicOf(x.text);tally[t]=(tally[t]||0)+1;(prod[t]=prod[t]||{})[x.product||'제품 미기재']=(prod[t][x.product||'제품 미기재']||0)+1;if(!ex[t]||x.d>ex[t].d)ex[t]=x});
  const tops=topN(tally,4),tot=c.voices.length;
  const issues=tops.length?tops.map(([t,n],i)=>{const pp=topN(prod[t],1)[0];const e=ex[t];return'<div class="issue"><div class="i-top"><span class="i-rank">'+(i+1)+'</span><b>'+esc(t)+'</b><span class="i-n">'+n+'건<small>'+Math.round(n/tot*100)+'%</small></span></div><div class="trk"><i style="width:'+(n/tops[0][1]*100)+'%"></i></div><div class="i-sub" title="'+esc(e.text)+'"><b>'+esc(pp[0])+' '+pp[1]+'건</b> · '+esc(e.src)+' “'+esc(e.text.slice(0,60))+'”</div></div>'}).join(''):'<div class="empty">'+(covered('inquiry',cur)||D.inquiry.length&&FIRST.inquiry<=cur.end?'이 기간에 접수된 고객 이슈가 없습니다.':'고객 탭은 '+(FIRST.inquiry?md(FIRST.inquiry):'—')+'부터 기록되어 있습니다.')+'</div>';

  // 재입고
  const rs={},rtags={};c.asks.filter(x=>RESTOCK.test(x.text)).forEach(x=>{const k=x.product||'제품 미기재';rs[k]=(rs[k]||0)+1;models(x).forEach(m=>{(rtags[k]=rtags[k]||{})[m]=((rtags[k]||{})[m]||0)+1})});
  const rtop=topN(rs,5);
  const restock=rtop.length?rtop.map(([k,n],i)=>'<div class="li"><span class="no">'+(i+1)+'</span><div class="nm"><b>'+esc(k)+'</b>'+(rtags[k]?'<small>'+esc(topN(rtags[k],3).map(a=>a[0]).join(' · '))+'</small>':'')+'</div><span class="v">'+n+'<small>건</small></span></div>').join(''):'<div class="empty">이 기간 재입고 요청이 없습니다.</div>';

  // 판매 TOP
  const og={},on={};D.orders.filter(x=>inR(x.d,cur)).forEach(x=>{const k=x.code.split('-')[0]||x.code;og[k]=(og[k]||0)+x.qty;const nm=cleanName(x.name);if(nm)((on[k]=on[k]||{})[nm]=(on[k][nm]||0)+x.qty)});
  const otop=topN(og,5),otot=Object.values(og).reduce((a,b)=>a+b,0);
  const sales=otop.length?otop.map(([k,n],i)=>'<div class="li"><span class="no">'+(i+1)+'</span><div class="nm"><b>'+esc(on[k]?topN(on[k],1)[0][0]:k)+'</b><small>'+esc(k)+' · 전체의 '+Math.round(n/otot*100)+'%</small></div><span class="v">'+fmt(n)+'<small>개</small></span></div>').join(''):'<div class="empty">이 기간 주문 원장 기록이 없습니다.</div>';

  // CX 코멘트 + 확인 필요
  const wk=D.weekly.filter(w=>w.start<=cur.end&&w.end>=cur.start&&(w.note||w.bad||w.restock)).sort((a,b)=>b.start.localeCompare(a.start))[0];
  const open=D.incidents.filter(x=>!x.done).sort((a,b)=>a.d.localeCompare(b.d));
  const note=(wk?'<div class="note"><span class="tag">주간보고 '+esc(wk.label)+'</span><dl>'+(wk.note?'<dt>이번 주 해석</dt><dd>'+esc(wk.note)+'</dd>':'')+(wk.bad?'<dt>불만 TOP3</dt><dd>'+esc(wk.bad)+'</dd>':'')+(wk.good?'<dt>칭찬 TOP3</dt><dd>'+esc(wk.good)+'</dd>':'')+'</dl></div>':'<div class="empty">이 기간 주간보고 코멘트가 없습니다.</div>')
    +(open.length?'<div class="alert bad"><b>'+open.length+'건</b> 처리 완료되지 않은 배송사고 · 가장 오래된 접수 '+md(open[0].d)+'</div>':(D.incidents.length?'<div class="alert">미처리 배송사고 없음</div>':''));

  $('app').innerHTML='<div class="kpis">'+tiles+'</div>'
   +'<div class="row a"><section class="panel chart"><div class="ph"><h2>출고 · 배송 사고율 추이</h2><span>'+(mode==='week'?'최근 10주':mode==='month'?'최근 12개월':'월별')+'</span></div><p class="pd">출고가 늘 때 사고율이 함께 오르는지 확인하세요.</p>'+chartSVG(buckets(mode,p))+'</section>'
   +'<section class="panel"><div class="ph"><h2>고객이 가장 많이 말한 이슈</h2><span>총 '+tot+'건</span></div><p class="pd">게시판 문의 · 채팅 상담 · 3점 이하 리뷰를 주제별로 묶었습니다.</p>'+issues+'</section></div>'
   +'<div class="row b"><section class="panel"><div class="ph"><h2>재입고 요청 TOP</h2><span>문의·채팅</span></div><p class="pd">팔 수 있었지만 재고가 없어 놓친 수요입니다.</p>'+restock+'</section>'
   +'<section class="panel"><div class="ph"><h2>많이 나간 제품 TOP 5</h2><span>'+fmt(otot)+'개</span></div><p class="pd">주문 원장 출고 수량 기준 (옵션 합산)</p>'+sales+'</section>'
   +'<section class="panel"><div class="ph"><h2>CX팀 코멘트</h2><span>주간보고</span></div><p class="pd">CX팀이 직접 남긴 이번 기간 해석입니다.</p>'+note+'</section></div>';
  $('app').querySelectorAll('.bar').forEach(el=>el.addEventListener('click',()=>{const[m,a]=el.dataset.go.split('|');state.mode=m;state.anchor=a;render()}));
}

/* ---------- 불러오기 / 상태 ---------- */
let loading=false;
async function load(){
  if(loading)return;loading=true;
  $('status').className='status';$('statusText').textContent='불러오는 중';
  let T={},failed=[];
  if(window.CX_TEST_TABLES){for(const s of SOURCES){try{T[s.key]=toTable(window.CX_TEST_TABLES[s.key],s.need)}catch(e){failed.push(s.key)}}}
  else{const res=await Promise.allSettled(SOURCES.map(fetchSource));res.forEach((r,i)=>{if(r.status==='fulfilled')T[SOURCES[i].key]=r.value;else failed.push(SOURCES[i].key)})}
  loading=false;
  if(failed.length===SOURCES.length&&D){$('status').className='status err';$('statusText').textContent='연결 실패 · 이전 데이터 표시';return}
  const firstLoad=!D;build(T);if(firstLoad||!state.anchor)state.anchor=LAST;
  const now=new Date();
  $('status').className='status '+(failed.length?'err':'live');
  $('statusText').textContent=(failed.length?'일부 연결 실패':'실시간')+' · '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+' 갱신';
  const bn=$('banner');
  if(failed.length){bn.style.display='block';bn.innerHTML='<b>다음 탭을 불러오지 못했습니다:</b> '+failed.map(k=>esc(LABEL[k])).join(', ')+'<br>시트 공유가 “링크가 있는 모든 사용자 · 뷰어”인지, 탭 이름과 머리글이 바뀌지 않았는지 확인해 주세요.'}else bn.style.display='none';
  render();
}
document.querySelectorAll('#modeSeg button').forEach(b=>b.addEventListener('click',()=>{if(!D)return;state.mode=b.dataset.mode;state.anchor=LAST;render()}));
$('prevBtn').onclick=()=>{const p=shift(state.mode,periodOf(state.mode,state.anchor),-1);state.anchor=p.start;render()};
$('nextBtn').onclick=()=>{const p=shift(state.mode,periodOf(state.mode,state.anchor),1);state.anchor=minS(p.start<=LAST?p.start:LAST,LAST);render()};
$('refreshBtn').onclick=load;
setInterval(()=>{if(!document.hidden)load()},10*60*1000);
window.__fbCXSetTab=function(){window.scrollTo({top:0,behavior:'smooth'})};

/* ---------- 테마 ---------- */
function syncTheme(){const t=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';$('themeLightBtn').classList.toggle('active',t==='light');$('themeDarkBtn').classList.toggle('active',t==='dark');document.querySelector('meta[name="theme-color"]').content=t==='light'?'#f5f6f8':'#12151c'}
function setTheme(v){document.documentElement.setAttribute('data-theme',v);try{localStorage.setItem('theme',v)}catch(e){}syncTheme()}
$('themeLightBtn').onclick=()=>setTheme('light');$('themeDarkBtn').onclick=()=>setTheme('dark');
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});syncTheme();
load();
})();
</script>
<script>
/**
 * FRAME BY 대시보드 공용 좌측 사이드바
 * - 대시보드 라이트/다크 모드와 자동 연동

 * - 라이트모드: 검정 로고

(function () {

  const HOME_URL =
    "https://frameby-marketing.github.io/Dashboard_Hub/";

  const LOGO_BLACK =
    "https://frameby-marketing.github.io/Dashboard_Hub/logo-black.png";

  const LOGO_WHITE =
    "https://frameby-marketing.github.io/Dashboard_Hub/logo-white.png";

  const LEGACY_HOME_THEME_KEY = "fb-hub-theme";

  /* =========================================================
     URL / 현재 메뉴 확인
     ========================================================= */

  function firstPathSegment(pathname) {

    return (
      pathname
        .split("/")
        .filter(Boolean)[0] || ""
    ).toLowerCase();

  }


  function repoSegmentOf(url) {

    try {

      return firstPathSegment(
        new URL(url).pathname
      );

    }

    catch (e) {

      return "";

    }

  }


  const currentSeg =
    firstPathSegment(location.pathname);


  function detectActive() {

    for (const dept of DEPARTMENTS) {


      /* 같은 대시보드 안의 해시 탭과 개별 페이지를 함께 판별합니다. */
      if (dept.baseUrl && repoSegmentOf(dept.baseUrl) === currentSeg) {
        const hashTab = (location.hash || "").replace("#", "");
        const items = dept.groups ? dept.groups.flatMap(group => group.items) : dept.items;
        const item = items.find(it => it.tab === hashTab) || items.find(it => it.tab === "overview") || items[0];
        return { deptId: dept.id, itemId: item ? item.id : null };
      }
      const items = dept.groups ? dept.groups.flatMap(group => group.items) : dept.items;
      for (const item of items) {
        if (item.url && repoSegmentOf(item.url) === currentSeg) {
          return { deptId: dept.id, itemId: item.id };
        }
      }
    }


    return {

      deptId: null,

      itemId: null

    };

  }

  /* =========================================================

     ========================================================= */

  function getTheme() {

    const htmlTheme =
      document.documentElement
        .getAttribute("data-theme");


    if (
      htmlTheme === "light" ||
      htmlTheme === "dark"
    ) {

      return htmlTheme;

    }


    try {

      const saved =
        localStorage.getItem(THEME_KEY);


      if (
        saved === "light" ||
        saved === "dark"
      ) {

        return saved;

      }

    }

    catch (e) {}


    return "dark";

  }


  function restoreTheme() {

    try {

      let saved =
        localStorage.getItem(THEME_KEY);

      /* 예전 홈에서 사용하던 키가 남아 있으면 공통 키로 한 번만 이전합니다. */
      if (saved !== "light" && saved !== "dark") {

        const legacySaved =
          localStorage.getItem(LEGACY_HOME_THEME_KEY);

        if (
          legacySaved === "light" ||
          legacySaved === "dark"
        ) {

          saved = legacySaved;
          localStorage.setItem(THEME_KEY, saved);

        }

      }

      localStorage.removeItem(LEGACY_HOME_THEME_KEY);


      if (
        saved === "light" ||
        saved === "dark"
      ) {

        document.documentElement
          .setAttribute(
            "data-theme",
            saved
          );

      }

    }

    catch (e) {}

  }


  function saveTheme(theme) {

    if (
      theme !== "light" &&
      theme !== "dark"
    ) {

      return;

    }


    try {

      localStorage.setItem(
        THEME_KEY,
        theme
      );

    }

    catch (e) {}

  }


  function syncSidebarTheme() {

    const sidebar =
      document.getElementById(
        SIDEBAR_ID
      );


    if (!sidebar) return;


    const theme =
      getTheme();


    sidebar.dataset.theme =
      theme;


    if (!THEME_BOOT_LOCKED) {

      saveTheme(theme);

    }


    const logo =
      sidebar.querySelector(
        ".fb-brand-logo"
      );


    if (logo) {

      logo.src =
        theme === "light"
          ? LOGO_BLACK
          : LOGO_WHITE;

    }

  }

  function isCollapsed() {

    try {

      return (
        localStorage.getItem(

        ) === "1"

    }

    catch (e) {

      return false;

    }

  }


  function setCollapsed(value) {

    try {

      localStorage.setItem(
        COLLAPSE_KEY,
        value ? "1" : "0"
      );

    }

    catch (e) {}

  }

  function applyBodyOffset() {

  /* =========================================================
     링크
     ========================================================= */

  function itemHref(
    dept,
    item
  ) {

    if (item.tab) {

      const deptSeg =
        repoSegmentOf(
          dept.baseUrl
        );


      if (
        deptSeg === currentSeg
      ) {

        return "#" + item.tab;

      }


      return (
        dept.baseUrl +
        "#" +
        item.tab
      );

    }


    return item.url;

  }



  function onItemClick(
    ev,
    dept,
    item
  ) {

    if (!item.tab) {

      return;

    }


    const deptSeg =
      repoSegmentOf(
        dept.baseUrl
      );


    if (
      deptSeg !== currentSeg
    ) {

      return;

    }


    ev.preventDefault();


    const setTab = dept.id === "cx" ? window.__fbCXSetTab : window.__fbOperationSetTab;
    if (typeof setTab === "function") setTab(item.tab);


    try {

      history.replaceState(
        null,
        "",
        "#" + item.tab
      );

    }

    catch (e) {

      location.hash =
        item.tab;

    }


    active = {

      deptId: dept.id,

      itemId: item.id

    };


    updateActiveHighlight();

  }



  /* =========================================================
     아코디언
     ========================================================= */

  function openExclusively(
    deptId
  ) {

    openDeptId =
      deptId;


    document
      .querySelectorAll(
        `#${SIDEBAR_ID} .fb-dept`
      )
      .forEach(el => {

        el.classList.toggle(
          "open",
          el.dataset.dept === deptId
        );

      });

  }



  /* =========================================================
     렌더링
     ========================================================= */

  function render() {

    const sidebar =
      document.createElement("nav");


    sidebar.id =
      SIDEBAR_ID;


    if (
      isCollapsed()
    ) {

      sidebar.classList
        .add("collapsed");

    }



    /* 상단 */

    const top =
      document.createElement("div");


    top.className =
      "fb-sb-top";


    const initialLogo =
      getTheme() === "light"
        ? LOGO_BLACK
        : LOGO_WHITE;


    top.innerHTML = `

      <a
        class="fb-sb-home"
        href="${HOME_URL}"
        aria-label="FRAME BY 홈"
      >

        <img
          class="fb-brand-logo"
          src="${initialLogo}"
          alt="FRAME BY"
        >

        <span class="label">
          FRAME BY
        </span>

      </a>


      <button
        class="fb-sb-toggle"
        type="button"
        title="사이드바 접기/펼치기"
      >

        ${
          isCollapsed()
            ? "»"
            : "«"
        }

      </button>

    `;



    const toggleBtn =
      top.querySelector(
        ".fb-sb-toggle"
      );


    toggleBtn
      .addEventListener(
        "click",
        () => {

          const collapsed =
            !sidebar.classList
              .contains(
                "collapsed"
              );


          sidebar.classList
            .toggle(
              "collapsed",
              collapsed
            );


          document.body
            .classList
            .toggle(
              "fb-sidebar-collapsed",
              collapsed
            );


          setCollapsed(
            collapsed
          );


          toggleBtn.textContent =
            collapsed
              ? "»"
              : "«";

        }
      );


    sidebar
      .appendChild(top);



    /* 메뉴 */

    const body =
      document.createElement("div");


    body.className =
      "fb-sb-body";



    DEPARTMENTS
      .forEach(
        dept => {


          const wrap =
            document.createElement(
              "div"
            );


          wrap.className =
            "fb-dept" +
            (
              openDeptId ===
              dept.id
                ? " open"
                : ""
            );


          wrap.dataset.dept =
            dept.id;



          /* 부서명 */

          const head =
            document.createElement(
              "button"
            );


          head.type =
            "button";


          head.className =
            "fb-dept-head";


          head.innerHTML = `

            <span
              class="fb-dept-collapsed-mark"
            >

              ${
                dept.name
                  .charAt(0)
                  .toUpperCase()
              }

            </span>


            <span
              class="fb-dept-name"
            >

              ${dept.name}

            </span>


            <span
              class="fb-dept-caret"
            >
              ▸
            </span>

          `;



          head.addEventListener(
            "click",
            () => {


              if (
                sidebar.classList
                  .contains(
                    "collapsed"
                  )
              ) {

                sidebar.classList
                  .remove(
                    "collapsed"
                  );


                document.body
                  .classList
                  .remove(
                    "fb-sidebar-collapsed"
                  );


                setCollapsed(
                  false
                );


                toggleBtn
                  .textContent =
                  "«";

              }


              const willOpen =
                !wrap.classList
                  .contains(
                    "open"
                  );


              openExclusively(
                willOpen
                  ? dept.id
                  : null
              );

            }
          );


          wrap
            .appendChild(head);



          /* 하위 메뉴 */

          const itemsOuter =
            document.createElement(
              "div"
            );


          itemsOuter.className =
            "fb-dept-items";


          const itemsInner =
            document.createElement(
              "div"
            );


          itemsInner.className =
            "fb-dept-items-inner";



          const addItem = (item, target, nested = false) => {
            const a = document.createElement("a");
            a.className = "fb-item" + (nested ? " fb-item-nested" : "");
            a.dataset.dept = dept.id;
            a.dataset.item = item.id;
            a.href = itemHref(dept, item);
            const dot = document.createElement("span");
            dot.className = "fb-item-dot";
            const label = document.createElement("span");
            label.textContent = item.name;
            a.append(dot, label);
            a.addEventListener("click", ev => onItemClick(ev, dept, item));
            target.appendChild(a);
          };
          if (dept.groups) {
            dept.groups.forEach(group => {
              const groupWrap = document.createElement("div");
              groupWrap.className = "fb-menu-group";
              groupWrap.dataset.group = group.id;
              const groupHead = document.createElement("button");
              groupHead.type = "button";
              groupHead.className = "fb-group-head";
              groupHead.textContent = group.name;
              groupHead.setAttribute("aria-expanded", "false");
              groupHead.addEventListener("click", () => {
                const opening = !groupWrap.classList.contains("open");
                itemsInner.querySelectorAll(".fb-menu-group").forEach(el => {
                  el.classList.remove("open");
                  el.querySelector(".fb-group-head")?.setAttribute("aria-expanded", "false");
                });
                groupWrap.classList.toggle("open", opening);
                groupHead.setAttribute("aria-expanded", String(opening));
              });
              const children = document.createElement("div");
              children.className = "fb-group-items";
              group.items.forEach(item => addItem(item, children, true));
              groupWrap.append(groupHead, children);
              itemsInner.appendChild(groupWrap);
            });
          } else {
            dept.items.forEach(item => addItem(item, itemsInner));
          }


          itemsOuter
            .appendChild(
              itemsInner
            );


          wrap
            .appendChild(
              itemsOuter
            );


          body
            .appendChild(
              wrap
            );

        }
      );


    sidebar
      .appendChild(body);


    document.body
      .insertBefore(
        sidebar,
        document.body.firstChild
      );


    syncSidebarTheme();

    updateActiveHighlight();

  }



  /* =========================================================
     현재 메뉴 강조
     ========================================================= */

  function updateActiveHighlight() {

    document.querySelectorAll(`#${SIDEBAR_ID} .fb-menu-group`).forEach(group => {
      if (group.querySelector(`.fb-item[data-item="${active.itemId}"]`)) {
        group.classList.add("open");
        group.querySelector(".fb-group-head")?.setAttribute("aria-expanded", "true");
      }
    });

    document
      .querySelectorAll(
        `#${SIDEBAR_ID} .fb-item`
      )
      .forEach(
        el => {

          el.classList.toggle(

            "active",

            el.dataset.dept ===
              active.deptId &&

            el.dataset.item ===
              active.itemId

          );

        }
      );

  }



  /* =========================================================
     실행
     ========================================================= */

  function boot() {

    if (
      document.getElementById(
        SIDEBAR_ID
      )
    ) {

      return;

    }


    restoreTheme();

    injectStyle();

    render();

    applyBodyOffset();

    syncSidebarTheme();



    /* data-theme 변경 감시 */

    const themeObserver =
      new MutationObserver(
        () => {

          syncSidebarTheme();

        }
      );


    themeObserver.observe(

      document.documentElement,

      {

        attributes:true,

        attributeFilter:[
          "data-theme"
        ]

      }

    );


    /*
     * 일부 대시보드는 로딩 과정에서 data-theme="dark"를 다시 넣습니다.
     * 모든 초기 스크립트가 끝난 뒤 저장된 공통 테마를 한 번 더 적용하고,
     * 그 이후의 변경만 사용자가 선택한 값으로 저장합니다.
     */
    const finishThemeBoot = () => {

      window.setTimeout(
        () => {

          document.documentElement.setAttribute(
            "data-theme",
            INITIAL_SAVED_THEME
          );
          saveTheme(INITIAL_SAVED_THEME);
          THEME_BOOT_LOCKED = false;
          syncSidebarTheme();

        },
        250
      );

    };


    if (document.readyState === "complete") {

      finishThemeBoot();

    } else {

      window.addEventListener(
        "load",
        finishThemeBoot,
        { once:true }
      );

    }



    /* 다른 탭에서 테마 변경 */

    window.addEventListener(
      "storage",
      e => {

        if (
          e.key === THEME_KEY &&
          (
            e.newValue === "light" ||
            e.newValue === "dark"
          )
        ) {

          document.documentElement
            .setAttribute(
              "data-theme",
              e.newValue
            );


          syncSidebarTheme();

        }

      }
    );



    /* 사이드바 삭제 시 복구 */

    const bodyObserver =
      new MutationObserver(
        () => {

          if (
            !document.getElementById(
              SIDEBAR_ID
            )
          ) {

            render();

            applyBodyOffset();

            syncSidebarTheme();

          }

        }
      );


    bodyObserver.observe(

      document.body,

      {
        childList:true
      }

    );



    /* Operation 해시 */

    window.addEventListener(
      "hashchange",
      () => {

        active =
          detectActive();


        if (
          active.deptId
        ) {

          openExclusively(
            active.deptId
          );

        }


        updateActiveHighlight();

      }
    );

  }



  if (
    document.body
  ) {

    boot();

  }

  else {

    document.addEventListener(
      "DOMContentLoaded",
      boot
    );

  }


})();

</script>
</body></html>
